<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2fa1b3">
  <title>AI Talent Platform — Student Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./typography.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root{
      --brand:#2fa1b3;--brand-dark:#005654;--brand-soft:#e3f1f3;--orange:#f05b2f;
      --orange-soft:#fff0e9;--green:#148269;--green-soft:#e7f5f0;--yellow:#f1ad38;
      --ink:#202426;--muted:#747b7e;--subtle:#eef0f2;--line:#e6e9ea;--white:#fff;
      --danger:#d94c3c;--danger-soft:#fff0ee;--sidebar:248px
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--subtle);color:var(--ink);font:14px/1.55 "Lexend",sans-serif}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    a{text-decoration:none;color:inherit}
    h1,h2,h3,p{margin-top:0}
    h1{font-size:28px;line-height:1.25;letter-spacing:-.035em}
    h2{font-size:18px;line-height:1.35;letter-spacing:-.025em}
    h3{font-size:14px;line-height:1.4}
    .hidden{display:none!important}
    .muted{color:var(--muted)}
    .tiny{font-size:11px;color:var(--muted)}
    .eyebrow{margin:0 0 8px;color:var(--brand);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
    .btn{min-height:42px;border:0;border-radius:999px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:600;transition:.18s ease}
    .btn:hover{transform:translateY(-1px)}
    .btn:disabled{cursor:not-allowed;opacity:.42;transform:none}
    .btn-primary{background:var(--brand);color:#fff}
    .btn-primary:hover{background:#278f9f}
    .btn-dark{background:var(--brand-dark);color:#fff}
    .btn-orange{background:var(--orange);color:#fff}
    .btn-outline{border:1px solid #d9dfe0;background:#fff;color:var(--ink)}
    .btn-ghost{background:transparent;color:var(--muted)}
    .btn-sm{min-height:34px;padding:0 14px;font-size:11px}
    .card{background:#fff;border:1px solid #eceeef;border-radius:8px}
    .tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:10px;font-weight:600;background:var(--brand-soft);color:var(--brand-dark)}
    .tag.done{background:var(--green-soft);color:var(--green)}
    .tag.locked{background:#f0f1f2;color:#909597}
    .tag.current{background:var(--orange-soft);color:#b84926}
    .progress{height:7px;border-radius:999px;background:#e7ebec;overflow:hidden}
    .progress span{height:100%;display:block;border-radius:inherit;background:var(--brand);transition:width .35s ease}

    /* Login */
    .auth-page{min-height:100vh;padding:42px 20px;background:#fafafa;display:grid;place-items:center}
    .auth-card{width:min(460px,100%);padding:40px 44px 36px;background:#fff;border:1px solid #f0f0f0;border-radius:16px;text-align:center;box-shadow:0 10px 30px rgba(34,67,72,.04)}
    .auth-logo{width:44px;height:44px;border-radius:12px;margin:0 auto 18px;background:var(--brand);display:grid;place-items:center;color:#fff;font-size:21px;font-weight:700}
    .auth-card h1{font-size:23px;margin-bottom:5px}
    .auth-brand{color:var(--brand-dark);font-size:26px;font-weight:700;letter-spacing:-.035em}
    .auth-copy{color:var(--muted);font-size:12px;line-height:1.7;margin:10px auto 18px;max-width:330px}
    .login-visual{height:170px;width:240px;margin:0 auto 24px;position:relative;border-radius:22px;background:linear-gradient(145deg,#dff1f3,#f7fbfb);overflow:hidden}
    .login-visual:before,.login-visual:after{content:"";position:absolute;border-radius:50%}
    .login-visual:before{width:120px;height:120px;right:-25px;top:-32px;background:#c1e4e8}
    .login-visual:after{width:95px;height:95px;left:-25px;bottom:-30px;background:#ffd9ca}
    .visual-window{position:absolute;z-index:1;left:42px;right:42px;top:33px;bottom:27px;padding:14px;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(0,86,84,.12);text-align:left}
    .visual-row{height:7px;border-radius:5px;background:#e9eff0;margin-bottom:8px}
    .visual-row:nth-child(2){width:66%;background:#7ac5ce}
    .visual-row:nth-child(3){width:82%}
    .visual-avatar{width:31px;height:31px;border-radius:50%;background:var(--orange);margin-bottom:12px}
    .auth-actions{display:grid;gap:10px}
    .auth-actions .btn{width:100%;position:relative}
    .auth-actions .btn i,.provider-letter{position:absolute;left:17px}
    .zalo-btn{background:var(--brand);color:#fff}
    .provider-letter{width:19px;height:19px;border-radius:5px;background:#fff;color:var(--brand);display:grid;place-items:center;font-size:10px;font-weight:700}
    .auth-divider{display:flex;align-items:center;gap:11px;margin:15px 0;color:#a0a5a7;font-size:10px}
    .auth-divider:before,.auth-divider:after{content:"";height:1px;flex:1;background:var(--line)}
    .auth-foot{margin:20px 0 0;color:var(--muted);font-size:11px}
    .auth-foot button{border:0;background:none;color:var(--brand-dark);font-weight:600;padding:0}
    .powered{margin:18px 0 0;color:#a1a6a8;font-size:9px}

    /* Onboarding */
    .onboarding-page{min-height:100vh;background:#fff}
    .onboarding-top{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center}
    .onboarding-top-inner{width:min(900px,calc(100% - 40px));margin:auto;display:flex;align-items:center;justify-content:space-between}
    .mini-brand{display:flex;align-items:center;gap:11px}
    .mini-brand-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-dark)}
    .mini-brand b{display:block;font-size:13px}
    .mini-brand small{display:block;color:var(--muted);font-size:9px;margin-top:1px}
    .step-count{font-size:11px;color:var(--muted)}
    .onboarding-body{width:min(820px,calc(100% - 40px));margin:0 auto;padding:38px 0 60px}
    .step-rail{display:flex;align-items:center;margin:0 auto 46px;max-width:680px}
    .rail-part{display:flex;align-items:center;flex:1}
    .rail-part:last-child{flex:0}
    .rail-dot{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;background:#edf0f1;color:#8a9193;font-size:10px;font-weight:700}
    .rail-dot.active{background:var(--brand);color:#fff;box-shadow:0 0 0 5px var(--brand-soft)}
    .rail-dot.done{background:var(--brand-dark);color:#fff}
    .rail-line{height:2px;flex:1;background:#e7eaeb}
    .rail-line.done{background:var(--brand)}
    .onboarding-content{max-width:640px;margin:auto}
    .onboarding-heading{text-align:center;margin-bottom:28px}
    .onboarding-heading h1{margin-bottom:8px}
    .onboarding-heading p{color:var(--muted);font-size:12px;margin:0 auto;max-width:510px}
    .persona-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .persona-card{min-height:176px;padding:24px;text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;position:relative}
    .persona-card:hover,.persona-card.selected{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,161,179,.1)}
    .persona-card.selected:after{content:"✓";position:absolute;right:16px;top:15px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;font-size:10px}
    .persona-icon{width:42px;height:42px;border-radius:11px;background:var(--brand-soft);color:var(--brand-dark);display:grid;place-items:center;margin-bottom:17px;font-size:17px}
    .persona-card:nth-child(2) .persona-icon{background:var(--orange-soft);color:var(--orange)}
    .persona-card b{display:block;font-size:15px;margin-bottom:6px}
    .persona-card span:not(.persona-icon){display:block;color:var(--muted);font-size:11px;line-height:1.65}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}
    .field{display:grid;gap:7px}
    .field.full{grid-column:1/-1}
    .field label{font-size:10px;color:#555d60;font-weight:600}
    .field input,.field select,.field textarea{width:100%;border:1px solid #dde2e3;border-radius:7px;background:#fff;color:var(--ink);outline:0;padding:11px 12px;font-size:12px}
    .field textarea{min-height:92px;resize:vertical}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,161,179,.1)}
    .upload{border:1px dashed #bfd7da;border-radius:9px;padding:25px;text-align:center;background:#f9fcfc}
    .upload i{font-size:22px;color:var(--brand);margin-bottom:10px}
    .upload b{display:block;font-size:12px;margin-bottom:5px}
    .upload p{font-size:10px;color:var(--muted);margin-bottom:13px}
    .upload-state{margin-top:10px;color:var(--green);font-size:10px;font-weight:600}
    .info-note{display:flex;gap:10px;margin-top:14px;padding:12px 14px;border-radius:7px;background:var(--brand-soft);color:#49676b;font-size:10px}
    .onboarding-actions{display:flex;justify-content:space-between;align-items:center;margin-top:28px}
    .analysis-wrap{text-align:center}
    .analysis-ring{width:128px;height:128px;margin:0 auto 28px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--brand) calc(var(--value)*1%),#e8edef 0);position:relative}
    .analysis-ring:before{content:"";position:absolute;inset:10px;background:#fff;border-radius:50%}
    .analysis-ring strong{position:relative;color:var(--brand-dark);font-size:22px}
    .analysis-list{max-width:410px;margin:auto;text-align:left}
    .analysis-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #eef0f1;font-size:11px}
    .analysis-item i{width:20px;color:#bbc1c3}
    .analysis-item.done i{color:var(--green)}
    .review-section{padding:18px 0;border-bottom:1px solid var(--line)}
    .review-section:first-child{padding-top:0}
    .review-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .review-title h3{margin:0}
    .review-title button{border:0;background:none;color:var(--brand);font-size:10px;font-weight:600}
    .review-card{padding:14px;border-radius:7px;background:#f7f9f9}
    .review-card b{display:block;font-size:11px}
    .review-card span{display:block;color:var(--muted);font-size:10px;margin-top:4px}
    .agent-summary{margin-bottom:14px;padding:15px;border:1px solid #dcebed;border-radius:8px;background:#f4fbfb}
    .agent-summary p{margin:7px 0 0;color:#516164;font-size:10px;line-height:1.6}
    .agent-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
    .agent-pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;background:#fff;color:var(--brand-dark);font-size:9px;font-weight:600}
    .agent-pill.warn{background:#fff3dd;color:#8d671c}
    .agent-evidence{margin-top:7px;color:#687376;font-size:9px;line-height:1.5}
    .agent-empty{padding:13px;border-radius:7px;background:#f7f9f9;color:var(--muted);font-size:10px}
    .skill-pills{display:flex;flex-wrap:wrap;gap:7px}
    .skill-pills span{border:1px solid #d9e2e3;border-radius:999px;padding:6px 10px;font-size:10px;color:#506063;background:#fff}
    .career-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
    .career-option{padding:15px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:left}
    .career-option.selected{border-color:var(--brand);background:#f4fbfb}
    .career-option i{color:var(--brand);width:24px}
    .career-option b{font-size:11px}
    .journey-box{padding:22px;border-radius:10px;background:linear-gradient(135deg,#e7f4f5,#f9fcfc)}
    .journey-box h2{margin-bottom:5px}
    .journey-box p{color:var(--muted);font-size:11px}
    .journey-list{display:grid;gap:9px;margin-top:20px}
    .journey-row{display:flex;align-items:flex-start;gap:11px;background:#fff;border:1px solid #e5ebec;border-radius:7px;padding:11px 13px;font-size:11px}
    .journey-row i{color:var(--green)}
    .journey-row b{display:block}
    .journey-row small{display:block;margin-top:4px;color:var(--muted);font-size:9px;line-height:1.5}
    .journey-rationale{margin-top:14px;padding:12px 14px;border-radius:7px;background:#fff;color:#536164;font-size:10px;line-height:1.6}
    .agent-unavailable{padding:14px 16px;border:1px solid #f0c3bb;border-radius:8px;background:#fff0ec;color:#9b3d2c;font-size:11px;line-height:1.5}

    /* Application shell */
    .portal{min-height:100vh}
    .sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;z-index:10}
    .side-brand{display:flex;align-items:center;gap:12px;padding:8px 10px 24px}
    .side-brand .logo{width:40px;height:40px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px}
    .side-brand b{display:block;color:#292f31;font-size:16px;font-weight:600}
    .side-brand small{display:block;color:#959a9c;font-size:8px;letter-spacing:.08em;text-transform:uppercase}
    .side-label{padding:0 12px;margin:9px 0 7px;color:#a0a5a7;font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
    .side-nav{display:grid;gap:3px}
    .side-nav button{width:100%;min-height:42px;padding:11px 14px;border:0;border-radius:8px;background:#fff;color:#657073;display:flex;align-items:center;gap:12px;text-align:left;font-size:15px;font-weight:400}
    .side-nav button i{width:18px;text-align:center;font-size:14px;color:#a0a6a8}
    .side-nav button:hover{background:#f5f9f9;color:var(--brand-dark)}
    .side-nav button.active{background:var(--brand-soft);color:var(--brand-dark);font-weight:600}
    .side-nav button.active i{color:var(--brand-dark)}
    .side-nav button.locked{color:#b4b9ba}
    .side-nav .nav-badge{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--orange)}
    .side-user{margin-top:auto;border-top:1px solid var(--line);padding:17px 7px 0;display:flex;align-items:center;gap:10px}
    .avatar{width:32px;height:32px;border-radius:50%;background:var(--orange-soft);color:#a84827;display:grid;place-items:center;font-size:10px;font-weight:700}
    .side-user b{display:block;font-size:10px}
    .side-user small{display:block;color:var(--muted);font-size:8px}
    .portal-main{margin-left:var(--sidebar);min-height:100vh;padding:28px 36px 56px}
    .page{max-width:1100px;margin:auto}
    .page-top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:24px}
    .page-top h1{margin-bottom:5px}
    .page-top p{margin:0;color:var(--muted);font-size:11px}
    .page-actions{display:flex;gap:9px}
    .metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
    .metric{padding:16px 17px}
    .metric small{display:block;color:var(--muted);font-size:9px}
    .metric strong{display:block;margin-top:8px;color:var(--brand-dark);font-size:22px;letter-spacing:-.04em}
    .metric span{display:block;color:var(--muted);font-size:9px;margin-top:2px}
    .home-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:14px}
    .welcome-card{padding:27px 30px;background:linear-gradient(125deg,#fff 45%,#e8f4f5);position:relative;overflow:hidden}
    .welcome-card:after{content:"";position:absolute;right:-45px;top:-55px;width:180px;height:180px;border-radius:50%;border:30px solid rgba(47,161,179,.1)}
    .welcome-card>*{position:relative;z-index:1}
    .welcome-card h1{max-width:560px;margin-bottom:9px}
    .welcome-card p{max-width:570px;color:var(--muted);font-size:11px}
    .welcome-card .btn{margin-top:11px}
    .score-card{padding:23px;text-align:center}
    .score-ring{width:118px;height:118px;margin:4px auto 14px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--score)*1%),#e8edee 0);display:grid;place-items:center;position:relative}
    .score-ring:before{content:"";position:absolute;inset:9px;border-radius:50%;background:#fff}
    .score-ring div{position:relative}
    .score-ring strong{display:block;color:var(--brand-dark);font-size:24px;line-height:1}
    .score-ring span{font-size:8px;color:var(--muted)}
    .section-card{margin-top:14px}
    .section-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:15px}
    .section-head h2{margin:0}
    .section-head p{margin:3px 0 0;color:var(--muted);font-size:10px}
    .section-body{padding:18px 19px}
    .next-course{display:flex;align-items:center;gap:17px}
    .course-number{width:52px;height:52px;border-radius:9px;background:var(--brand-soft);color:var(--brand-dark);display:grid;place-items:center;font-weight:700;font-size:18px}
    .next-course div:nth-child(2){flex:1}
    .next-course h3{margin-bottom:3px}
    .next-course p{margin:0;color:var(--muted);font-size:10px}
    .competency-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .competency-card{padding:14px;border:1px solid var(--line);border-radius:7px}
    .competency-card span{display:block;color:var(--muted);font-size:9px;margin-bottom:7px}
    .competency-card b{display:block;font-size:11px;margin-bottom:8px}

    /* Learning index */
    .summary-strip{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:14px}
    .summary-strip div{padding:14px 18px;border-right:1px solid var(--line)}
    .summary-strip div:last-child{border:0}
    .summary-strip strong{display:block;color:var(--brand-dark);font-size:18px}
    .summary-strip span{font-size:9px;color:var(--muted)}
    .assessment-row{margin-bottom:14px;padding:15px 18px;display:flex;align-items:center;gap:12px}
    .assessment-row i{width:30px;height:30px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center}
    .assessment-row b{font-size:11px}
    .assessment-row span{display:block;color:var(--muted);font-size:9px}
    .course-list{display:grid;gap:10px}
    .course-row{padding:18px;display:grid;grid-template-columns:48px minmax(0,1fr) 190px 118px;gap:16px;align-items:center}
    .course-row.current{border-color:#a9d8dd;box-shadow:inset 3px 0 var(--brand)}
    .course-row.locked{background:#f8f9f9;color:#919799}
    .course-index{width:42px;height:42px;border-radius:9px;background:var(--brand-soft);color:var(--brand-dark);display:grid;place-items:center;font-size:15px;font-weight:700}
    .course-row.done .course-index{background:var(--green-soft);color:var(--green)}
    .course-row.locked .course-index{background:#eceeef;color:#9ba1a3}
    .course-row h3{margin:0 0 4px}
    .course-meta{display:flex;gap:14px;color:var(--muted);font-size:9px}
    .course-points{text-align:right}
    .course-points strong{display:block;color:var(--brand-dark);font-size:14px}
    .course-points span{font-size:9px;color:var(--muted)}
    .course-row.locked .course-points strong{color:#919799}
    .course-action{text-align:right}
    .unlock-note{margin:13px 0 0;padding:11px 14px;border-radius:7px;background:#f7f9f9;color:var(--muted);font-size:9px}

    /* Learning index — canonical course-list layout */
    .learning-index-portal .portal-main{background:#f5f6f7;padding:32px 36px 52px}
    .learning-index-portal .page{max-width:1100px}
    .li-title{margin:0;color:#111416;font-size:var(--type-display-size);line-height:1.2;font-weight:var(--weight-medium);letter-spacing:var(--tracking-display)}
    .li-subtitle{margin:10px 0 0;color:#777f82;font-size:var(--type-row-title-size);line-height:1.7;font-weight:var(--weight-light)}
    .li-summary{display:flex;align-items:center;gap:26px;margin-top:22px;padding:22px 26px;border:1px solid #eceeef;border-radius:8px;background:#fff}
    .li-summary-count{flex:none;text-align:center}
    .li-summary-count strong{display:block;color:#292f31;font-size:var(--type-page-title-size);line-height:1;font-weight:var(--weight-semibold)}
    .li-summary-count span{display:block;margin-top:6px;color:#777f82;font-size:var(--type-meta-size);line-height:var(--type-meta-line);font-weight:var(--weight-light);white-space:nowrap}
    .li-summary-progress{flex:1;min-width:0}
    .li-summary-labels{display:flex;align-items:center;justify-content:space-between;gap:16px;color:#4e5659;font-size:var(--type-body-size);line-height:var(--type-body-line)}
    .li-summary-labels b{color:#292f31;font-weight:var(--weight-semibold);white-space:nowrap}
    .li-summary-track{height:8px;margin-top:10px;border-radius:999px;background:#e9ecef;overflow:hidden}
    .li-summary-track span{display:block;height:100%;border-radius:inherit;background:var(--brand);transition:width .3s ease}
    .li-panel{margin-top:20px;padding:22px 26px;border:1px solid #eceeef;border-radius:8px;background:#fff}
    .li-assessment{display:flex;align-items:center;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--line)}
    .li-assessment-icon{width:34px;height:34px;border-radius:8px;background:#eaf7f4;color:#00a989;display:grid;place-items:center;font-size:14px;flex:none}
    .li-assessment-title{flex:1;min-width:0;color:#343a3c;font-size:var(--type-row-title-size);line-height:var(--type-row-title-line);font-weight:var(--weight-medium)}
    .li-assessment-status{display:inline-flex;align-items:center;gap:7px;color:#008886;font-size:var(--type-supporting-size);line-height:var(--type-supporting-line);font-weight:var(--weight-semibold);white-space:nowrap}
    .li-assessment-status i{font-size:11px}
    .li-course{display:flex;align-items:flex-start;gap:18px;padding:22px 0;border-bottom:1px solid var(--line)}
    .li-course.current{padding-left:20px;border-left:3px solid var(--brand);border-radius:0 8px 8px 0;background:#fafafa}
    .li-course.locked{opacity:.72}
    .li-course-icon{width:52px;height:52px;border-radius:8px;display:grid;place-items:center;font-size:20px;flex:none}
    .li-course.done .li-course-icon{background:#eaf7f4;color:#00a989}
    .li-course.current .li-course-icon{background:var(--brand-soft);color:var(--brand)}
    .li-course.locked .li-course-icon{background:#f5f6f7;color:#8f9698}
    .li-course-copy{flex:1;min-width:0}
    .li-course-tag{display:inline-flex;align-items:center;min-height:24px;padding:0 12px;border-radius:999px;font-size:var(--type-meta-size);line-height:1;font-weight:var(--weight-semibold)}
    .li-course.done .li-course-tag{background:#eaf7f4;color:#008886}
    .li-course.current .li-course-tag{background:var(--brand-soft);color:var(--brand-dark)}
    .li-course.locked .li-course-tag{background:#f1f2f2;color:#555d60}
    .li-course-name{margin-top:10px;color:#181b1d;font-size:var(--type-feature-title-size);line-height:var(--type-feature-title-line);font-weight:var(--weight-semibold)}
    .li-course.locked .li-course-name{color:#555d60}
    .li-course-description{margin-top:6px;color:#777f82;font-size:var(--type-body-size);line-height:1.7;font-weight:var(--weight-light)}
    .li-course-meta{display:flex;flex-wrap:wrap;gap:18px;margin-top:12px}
    .li-course-meta span{display:inline-flex;align-items:center;gap:7px;color:#777f82;font-size:var(--type-supporting-size);line-height:var(--type-supporting-line)}
    .li-course-meta i{font-size:12px}
    .li-course-meta span:nth-child(1) i{color:var(--brand)}
    .li-course-meta span:nth-child(2) i{color:#c79a3a}
    .li-course-meta span:nth-child(3) i{color:#777f82}
    .li-segments{display:flex;gap:6px;margin-top:13px}
    .li-segments span{width:34px;height:6px;border-radius:999px;background:var(--line)}
    .li-segments span.done{background:#00b295}
    .li-segments span.current{background:var(--brand)}
    .li-course-side{min-width:150px;flex:none;text-align:right}
    .li-course-points{color:#292f31;font-size:var(--type-card-title-size);line-height:var(--type-card-title-line);font-weight:var(--weight-semibold)}
    .li-course.locked .li-course-points{color:#8f9698}
    .li-course-side .btn{min-height:44px;margin-top:14px}
    .li-lock-note{display:inline-flex;align-items:flex-start;gap:7px;max-width:150px;margin-top:12px;color:#777f82;text-align:left;font-size:var(--type-meta-size);line-height:var(--type-meta-line)}
    .li-lock-note i{margin-top:4px;font-size:10px;flex:none}
    .li-note{display:flex;align-items:flex-start;gap:10px;padding-top:20px;color:#777f82;font-size:var(--type-supporting-size);line-height:1.7;font-weight:var(--weight-light)}
    .li-note i{margin-top:4px;color:#c79a3a;flex:none}

    /* Course */
    .course-header{padding:21px 23px}
    .course-header-top{display:flex;justify-content:space-between;gap:20px}
    .course-header h1{font-size:22px;margin-bottom:5px}
    .course-header p{color:var(--muted);font-size:10px;margin-bottom:0}
    .module-track{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:20px}
    .module-tile{padding:12px;border:1px solid var(--line);border-radius:7px}
    .module-tile.done{background:var(--green-soft);border-color:transparent}
    .module-tile.current{background:var(--brand-soft);border-color:transparent}
    .module-tile.locked{background:#f5f6f6;color:#9da2a4}
    .module-tile b{display:block;font-size:10px}
    .module-tile>div>span{display:block;font-size:8px;margin-top:3px;color:var(--muted)}
    .course-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;margin-top:14px}
    .lesson-card{padding:23px}
    .lesson-card h2{font-size:19px;margin-bottom:7px}
    .lesson-intro{color:var(--muted);font-size:10px}
    .task-list{margin:20px 0}
    .task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eef0f0}
    .task:last-child{border:0}
    .task-icon{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eff1f2;color:#8d9496;font-size:9px}
    .task.done .task-icon{background:var(--green-soft);color:var(--green)}
    .task.current .task-icon{background:var(--brand);color:#fff}
    .task b{font-size:10px}
    .task span{display:block;color:var(--muted);font-size:8px}
    .case-box{padding:17px;border-radius:7px;background:#f5f9f9;border-left:3px solid var(--brand)}
    .case-box h3{color:var(--brand-dark);margin-bottom:6px}
    .case-box p{margin:0;color:#586568;font-size:10px;line-height:1.75}
    .answer-hints{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:16px 0}
    .answer-hint{padding:10px;border:1px solid var(--line);border-radius:7px}
    .answer-hint b{font-size:9px}
    .answer-hint span{display:block;color:var(--muted);font-size:8px;margin-top:2px}
    .answer-box{width:100%;min-height:150px;border:1px solid #dce1e2;border-radius:7px;padding:12px;resize:vertical;outline:0;font-size:11px;line-height:1.65}
    .answer-box:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,161,179,.1)}
    .submit-row{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:12px}
    .rubric-card{padding:19px;height:max-content;position:sticky;top:20px}
    .rubric-card h2{font-size:15px}
    .rubric-levels{display:grid;gap:8px;margin:14px 0 20px}
    .rubric-level{display:flex;align-items:center;gap:9px;font-size:9px;color:var(--muted)}
    .rubric-level span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#eef1f2;color:#7a8284;font-weight:700}
    .rubric-level.target{color:var(--brand-dark);font-weight:600}
    .rubric-level.target span{background:var(--brand);color:#fff}
    .reward{padding:14px;border-radius:7px;background:var(--orange-soft)}
    .reward b{display:block;color:#a84827;font-size:10px}
    .reward p{margin:4px 0 0;color:#8f604f;font-size:8px}

    /* Results */
    .result-layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:14px}
    .result-score-card{padding:27px;text-align:center}
    .stars{color:var(--yellow);letter-spacing:3px;font-size:18px;margin:10px 0}
    .result-number{font-size:36px;font-weight:700;color:var(--brand-dark);line-height:1}
    .result-number small{font-size:13px;color:var(--muted)}
    .result-score-card p{color:var(--muted);font-size:10px}
    .point-gain{display:inline-flex;border-radius:999px;padding:6px 11px;background:var(--green-soft);color:var(--green);font-size:10px;font-weight:600}
    .point-gain.fail{background:var(--danger-soft);color:var(--danger)}
    .feedback-card{padding:23px}
    .feedback-card blockquote{margin:14px 0;padding:13px 15px;background:#f6f9f9;border-left:3px solid var(--brand);color:#526164;font-size:10px;line-height:1.7}
    .trace{display:grid;gap:8px;margin:16px 0}
    .trace-row{display:flex;gap:9px;align-items:flex-start;font-size:10px}
    .trace-row i{color:var(--green);margin-top:3px}
    .trace-row.fail i{color:var(--danger)}
    .result-bottom{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
    .result-bottom .card{padding:19px}
    .result-bottom ul{padding-left:17px;margin:9px 0 0;color:var(--muted);font-size:10px;line-height:1.8}

    /* Learning Result — pass and retry states from the uploaded source */
    .learning-result-portal .portal-main{background:#f5f6f7;padding:30px 40px 56px}
    .learning-result-portal .page{max-width:916px}
    .lr-breadcrumb{margin-bottom:18px}
    .lr-score,.lr-coach,.lr-structure,.lr-progress-card{background:#fff;border:1px solid #eceeef;border-radius:8px}
    .lr-score{padding:34px 30px;text-align:center}
    .lr-score-icon{width:62px;height:62px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:27px}
    .lr-score.pass .lr-score-icon{background:#eaf7f4;color:#00a989}
    .lr-score.fail .lr-score-icon{background:#fdf4e3;color:#c79a3a}
    .lr-score-title{margin-top:16px;color:#121416;font-size:var(--type-page-title-size);line-height:var(--type-page-title-line);font-weight:var(--weight-medium);letter-spacing:var(--tracking-heading)}
    .lr-stars{display:flex;justify-content:center;gap:6px;margin-top:14px}
    .lr-stars i{font-size:25px;color:#c79a3a}
    .lr-stars i.empty{color:#dfe4e6}
    .lr-score-target{margin-top:12px;color:#777f82;font-size:var(--type-row-title-size);line-height:var(--type-row-title-line);font-weight:var(--weight-light)}
    .lr-score-target b{color:#252a2c;font-weight:var(--weight-semibold)}
    .lr-score.pass .lr-score-target strong{color:#008886}
    .lr-score.fail .lr-score-target strong{color:#c79a3a}
    .lr-result-pill{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 22px;margin-top:16px;border-radius:999px;font-size:var(--type-row-title-size);line-height:1;font-weight:var(--weight-semibold)}
    .lr-result-pill.pass{background:#eaf7f4;color:#008886}
    .lr-result-pill.fail{background:#f5f6f7;color:#4f5659}
    .lr-result-pill i{font-size:13px}
    .lr-agent-note{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:15px;color:#777f82;font-size:var(--type-meta-size);line-height:var(--type-meta-line)}
    .lr-agent-note i{color:var(--brand)}
    .lr-coach{margin-top:20px;overflow:hidden;border-color:rgba(47,161,179,.34)}
    .lr-coach-head{display:flex;align-items:center;gap:14px;padding:20px 26px;background:var(--brand-soft)}
    .lr-coach-icon{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:17px;flex:none}
    .lr-coach-title{flex:1;min-width:0}
    .lr-coach-title b{display:block;color:#202426;font-size:var(--type-card-title-size);line-height:var(--type-card-title-line);font-weight:var(--weight-semibold)}
    .lr-coach-title span{display:block;margin-top:2px;color:var(--brand-dark);font-size:var(--type-meta-size);line-height:var(--type-meta-line)}
    .lr-coach-status{display:inline-flex;align-items:center;gap:7px;min-height:26px;padding:0 12px;border-radius:999px;background:#fff;color:var(--brand-dark);font-size:var(--type-meta-size);line-height:1;font-weight:var(--weight-semibold);white-space:nowrap}
    .lr-coach-status.pass{color:#008886}
    .lr-coach-status-dot{width:6px;height:6px;border-radius:50%;background:var(--brand)}
    .lr-coach-status.pass .lr-coach-status-dot{background:#00b295}
    .lr-coach-body{padding:22px 26px 26px}
    .lr-rubric-quote,.lr-evidence{border-radius:0 8px 8px 0;border-left:3px solid #dfe4e6;padding:16px 20px;background:#f5f6f7}
    .lr-evidence{margin-top:14px;border-left-color:var(--brand);background:var(--brand-soft)}
    .lr-block-label{color:#777f82;font-size:var(--type-meta-size);line-height:var(--type-meta-line);font-weight:var(--weight-semibold);letter-spacing:var(--tracking-label);text-transform:uppercase}
    .lr-evidence .lr-block-label{color:var(--brand-dark)}
    .lr-block-copy{margin-top:8px;color:#535b5e;font-size:var(--type-row-title-size);line-height:1.75;font-weight:var(--weight-light);font-style:italic}
    .lr-evidence .lr-block-copy{color:#175f68}
    .lr-tip{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:16px 20px;border-radius:8px;background:#fde7df;color:#50585a;font-size:var(--type-body-size);line-height:var(--type-body-line)}
    .lr-tip i{margin-top:5px;color:var(--orange);flex:none}
    .lr-gap-label{margin-top:22px;color:#777f82;font-size:var(--type-meta-size);line-height:var(--type-meta-line);font-weight:var(--weight-semibold);letter-spacing:var(--tracking-label);text-transform:uppercase}
    .lr-gap-list{display:grid;gap:12px;margin-top:12px}
    .lr-gap{display:flex;gap:14px;padding:15px 18px;border-radius:8px;background:#fdf4e3}
    .lr-gap i{margin-top:4px;color:#c79a3a;flex:none}
    .lr-gap b{display:block;color:#292f31;font-size:var(--type-row-title-size);line-height:var(--type-row-title-line);font-weight:var(--weight-medium)}
    .lr-gap span{display:block;margin-top:3px;color:#666e71;font-size:var(--type-body-size);line-height:var(--type-body-line);font-weight:var(--weight-light)}
    .lr-plan{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
    .lr-plan-head{display:flex;align-items:center;justify-content:space-between;gap:20px}
    .lr-plan-head b{font-size:var(--type-card-title-size);line-height:var(--type-card-title-line);font-weight:var(--weight-medium)}
    .lr-plan-head span{color:#777f82;font-size:var(--type-meta-size);line-height:var(--type-meta-line)}
    .lr-plan-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
    .lr-plan-number{width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand-dark);display:grid;place-items:center;font-size:var(--type-meta-size);font-weight:var(--weight-semibold)}
    .lr-plan-copy b{display:block;font-size:var(--type-row-title-size);line-height:var(--type-row-title-line);font-weight:var(--weight-medium)}
    .lr-plan-copy span,.lr-plan-time{color:#777f82;font-size:var(--type-meta-size);line-height:var(--type-meta-line)}
    .lr-coach-ask{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
    .lr-ask-label{color:#777f82;font-size:var(--type-meta-size);line-height:var(--type-meta-line);font-weight:var(--weight-semibold);letter-spacing:var(--tracking-label);text-transform:uppercase}
    .lr-ask-row{display:flex;gap:10px;margin-top:12px}
    .lr-coach-input{flex:1;min-width:0;height:46px;padding:0 16px;border:1px solid #d9dfe0;border-radius:999px;background:#fff;color:#343a3c;font-size:var(--type-body-size);outline:0}
    .lr-coach-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,161,179,.13)}
    .lr-send{width:46px;height:46px;border:0;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
    .lr-prompt-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .lr-prompt{border:0;border-radius:999px;padding:7px 12px;background:#f5f6f7;color:#5d6568;font-size:var(--type-meta-size);line-height:var(--type-meta-line)}
    .lr-prompt i{margin-right:6px;color:var(--brand);font-size:10px}
    .lr-structure,.lr-progress-card{margin-top:20px;padding:26px 28px}
    .lr-card-head{display:flex;align-items:center;justify-content:space-between;gap:20px}
    .lr-card-head h2{margin:0;color:#202426;font-size:var(--type-card-title-size);line-height:var(--type-card-title-line);font-weight:var(--weight-medium)}
    .lr-card-head span{color:#777f82;font-size:var(--type-meta-size);line-height:var(--type-meta-line)}
    .lr-structure-list{margin-top:8px}
    .lr-structure-row{display:flex;gap:14px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--line)}
    .lr-structure-row>i{width:16px;margin-top:4px;text-align:center;flex:none}
    .lr-structure-row.ok>i{color:#00b295}
    .lr-structure-row.partial>i{color:#c79a3a}
    .lr-structure-row.missing>i{color:#ed1c24}
    .lr-structure-copy b{display:block;color:#292f31;font-size:var(--type-row-title-size);line-height:var(--type-row-title-line);font-weight:var(--weight-medium)}
    .lr-structure-copy span{display:block;margin-top:3px;color:#777f82;font-size:var(--type-body-size);line-height:var(--type-body-line);font-weight:var(--weight-light)}
    .lr-ai-summary{margin-bottom:16px;color:#536164;font-size:var(--type-body-size);line-height:1.6}
    .lr-confidence{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .lr-evidence-list{display:grid;gap:10px;margin-top:12px}
    .lr-evidence-item{padding:13px 15px;border-left:3px solid var(--brand);border-radius:0 7px 7px 0;background:#eef8f9}
    .lr-evidence-item q{display:block;color:#315a60;font-size:var(--type-body-size);font-style:italic;line-height:1.6}
    .lr-evidence-item span{display:block;margin-top:5px;color:#637174;font-size:var(--type-meta-size);line-height:1.5}
    .lr-next-action{margin-top:20px;padding:22px 26px;border:1px solid #d8e9eb;border-radius:8px;background:#f4fbfb}
    .lr-next-action h2{margin:0 0 6px;font-size:var(--type-card-title-size)}
    .lr-next-action p{margin:0;color:#566568;font-size:var(--type-body-size);line-height:1.6}
    .lr-next-meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
    .lr-progress-list{margin-top:20px}
    .lr-progress-row{margin-bottom:18px}
    .lr-progress-top{display:flex;align-items:center;justify-content:space-between;gap:16px}
    .lr-progress-top span{color:#343a3c;font-size:var(--type-row-title-size);line-height:var(--type-row-title-line)}
    .lr-progress-top b{font-size:var(--type-body-size);line-height:var(--type-body-line);font-weight:var(--weight-semibold);white-space:nowrap}
    .lr-progress-track{height:8px;margin-top:9px;border-radius:999px;background:var(--line);overflow:hidden}
    .lr-progress-track span{display:block;height:100%;border-radius:inherit;background:var(--brand)}
    .lr-progress-card.fail .lr-progress-track span{background:#aeb6bb}
    .lr-progress-delta{margin-top:6px;color:#008886;font-size:var(--type-meta-size);line-height:var(--type-meta-line)}
    .lr-progress-card.fail .lr-progress-delta{color:#777f82}
    .lr-actions{display:flex;gap:14px;margin-top:8px}
    .lr-actions .btn{min-height:48px;flex:1}
    .lr-actions .btn:last-child{flex:1.4}

    /* Profile */
    .profile-card{padding:23px;display:flex;align-items:center;gap:17px}
    .profile-avatar{width:62px;height:62px;border-radius:50%;background:var(--orange-soft);color:#ae4b29;display:grid;place-items:center;font-size:18px;font-weight:700}
    .profile-main{flex:1}
    .profile-main h1{font-size:20px;margin-bottom:2px}
    .profile-main p{color:var(--muted);font-size:9px;margin:0}
    .profile-stats{display:flex;gap:27px}
    .profile-stat strong{display:block;color:var(--brand-dark);font-size:19px}
    .profile-stat span{display:block;color:var(--muted);font-size:8px}
    .tabs{display:flex;gap:0;margin:14px 0;border-bottom:1px solid #dfe3e4}
    .tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:12px 15px;color:var(--muted);font-size:10px}
    .tabs button.active{border-color:var(--brand);color:var(--brand-dark);font-weight:600}
    .profile-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
    .highlight-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .highlight{padding:15px;border:1px solid var(--line);border-radius:7px}
    .highlight strong{display:block;color:var(--brand-dark);font-size:21px}
    .highlight b{font-size:10px}
    .highlight p{color:var(--muted);font-size:8px;margin:3px 0 0}
    .recommendation{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #edf0f0}
    .recommendation:last-child{border:0}
    .recommendation i{width:28px;height:28px;border-radius:8px;background:var(--brand-soft);color:var(--brand-dark);display:grid;place-items:center}
    .recommendation b{display:block;font-size:10px}
    .recommendation span{display:block;color:var(--muted);font-size:8px;margin-top:2px}
    .privacy-note{display:flex;gap:10px;margin-top:14px;padding:13px 15px;border:1px solid #e3e8e9;border-radius:7px;color:var(--muted);font-size:9px;background:#f9fafa}

    /* PMT ready */
    .ready-hero{padding:31px;text-align:center;background:linear-gradient(135deg,var(--brand-dark),#167f87);color:#fff;overflow:hidden;position:relative}
    .ready-hero:before,.ready-hero:after{content:"";position:absolute;border:26px solid rgba(255,255,255,.08);border-radius:50%}
    .ready-hero:before{width:150px;height:150px;left:-70px;bottom:-90px}
    .ready-hero:after{width:190px;height:190px;right:-80px;top:-100px}
    .ready-hero>*{position:relative;z-index:1}
    .ready-mark{width:57px;height:57px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;background:#fff;color:var(--brand-dark);font-size:22px}
    .ready-hero h1{font-size:27px;margin-bottom:7px}
    .ready-hero p{color:#cce9ea;font-size:10px;margin-bottom:20px}
    .ready-metrics{display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px}
    .ready-metrics div{padding:16px;text-align:center;border-right:1px solid var(--line)}
    .ready-metrics div:last-child{border:0}
    .ready-metrics strong{display:block;color:var(--brand-dark);font-size:20px}
    .ready-metrics span{font-size:8px;color:var(--muted)}
    .verified-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .verified{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:7px;font-size:10px}
    .verified i{color:var(--green)}
    .certificate{padding:22px;border:1px solid #b7dadd;background:linear-gradient(135deg,#fff,#eaf5f6);position:relative;overflow:hidden}
    .certificate:after{content:"A";position:absolute;right:15px;bottom:-28px;font-size:120px;font-weight:700;color:rgba(47,161,179,.08)}
    .certificate>*{position:relative;z-index:1}
    .certificate h2{color:var(--brand-dark);margin-bottom:4px}
    .certificate p{font-size:9px;color:var(--muted)}
    .tracking{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px}
    .track-step{position:relative;text-align:center}
    .track-step:not(:last-child):after{content:"";position:absolute;height:2px;background:#e1e5e6;top:14px;left:50%;right:-50%}
    .track-step.done:not(:last-child):after{background:var(--brand)}
    .track-dot{position:relative;z-index:1;width:29px;height:29px;border-radius:50%;margin:auto;display:grid;place-items:center;background:#eef1f2;color:#8f9698;font-size:9px}
    .track-step.done .track-dot{background:var(--brand);color:#fff}
    .track-step b{display:block;font-size:9px;margin-top:8px}
    .track-step>span:not(.track-dot){display:block;color:var(--muted);font-size:8px}

    /* PMT Ready + application tracking */
    .ready-portal .portal-main,.submitted-portal .portal-main{background:#f4f5f6;padding:34px 38px 54px}
    .ready-top,.submitted-top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
    .ready-top h1,.submitted-top h1{margin:0;color:#171b1d}
    .ready-top p,.submitted-top p{margin:7px 0 0;color:#777f82;font-weight:300}
    .pmt-hero{display:flex;align-items:center;gap:30px;margin-top:24px;padding:30px 34px;border:1px solid #a9e4d8;border-radius:8px;background:#e9f8f5}
    .pmt-hero-copy{flex:1;min-width:0}
    .pmt-kicker{color:#0b9181;font-size:var(--type-meta-size);line-height:var(--type-meta-line);font-weight:var(--weight-semibold);letter-spacing:var(--tracking-label);text-transform:uppercase}
    .pmt-hero h2{margin:10px 0 0;color:#111416;font-size:var(--type-display-size);line-height:var(--type-display-line);font-weight:var(--weight-medium)}
    .pmt-hero p{margin:10px 0 0;color:#4f6767;font-size:var(--type-body-size);line-height:var(--type-body-line);font-weight:var(--weight-light)}
    .pmt-verified{display:inline-flex;align-items:center;gap:8px;margin-top:18px;height:30px;padding:0 14px;border-radius:999px;background:#fff;color:#078c7f;font-size:var(--type-meta-size);font-weight:var(--weight-medium)}
    .pmt-hero-actions{display:flex;align-items:center;gap:12px;margin-top:20px}
    .pmt-hero-actions .btn{min-height:46px;padding:0 24px}
    .pmt-badge{width:154px;flex:none;text-align:center}
    .pmt-badge .pmt-badge-icon{width:112px;height:112px;margin:0 auto;border:2px solid #b9e5dc;border-radius:24px;background:#fff;color:#0db198;display:grid;place-items:center;font-size:47px;line-height:1}

    .pmt-badge b{display:block;margin-top:13px;font-size:var(--type-card-title-size);font-weight:var(--weight-medium)}
    .pmt-badge>span:not(.pmt-badge-icon){display:block;margin-top:3px;color:#777f82;font-size:var(--type-meta-size)}
    .pmt-overview{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;margin-top:20px}
    .pmt-summary,.pmt-competencies,.pmt-certificate,.pmt-opportunities{padding:26px 28px}
    .pmt-score-ring{width:132px;height:132px;margin:0 auto;border-radius:50%;padding:11px;background:conic-gradient(#0db198 100%,#e9ecec 0)}
    .pmt-score-inner{width:100%;height:100%;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;align-content:center}
    .pmt-score-inner strong{font-size:34px;line-height:1;font-weight:600;color:#171b1d}
    .pmt-score-inner span{display:block;color:#777f82;font-size:11px}
    .pmt-score-inner b{display:block;color:#078c7f;font-size:10px;letter-spacing:.04em}
    .pmt-summary h2{margin:18px 0 12px;text-align:center;font-size:var(--type-section-title-size)}
    .pmt-check-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #edf0f0;color:#343a3c;font-size:var(--type-body-size)}
    .pmt-check-row i{color:#0db198}
    .pmt-complete-pill{display:flex;align-items:center;justify-content:center;gap:8px;width:max-content;max-width:100%;margin:16px auto 0;padding:8px 14px;border-radius:999px;background:#e9f8f5;color:#078c7f;font-size:var(--type-meta-size);font-weight:500}
    .pmt-card-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}
    .pmt-card-heading h2{margin:0;font-size:var(--type-section-title-size)}
    .pmt-link{border:0;background:none;padding:0;color:var(--brand);font-size:var(--type-body-size);font-weight:500}
    .pmt-competency-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .pmt-competency{display:flex;align-items:center;gap:14px;min-height:90px;padding:17px 18px;border-radius:7px;background:#f5f6f6}
    .pmt-competency-icon{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;flex:none}
    .pmt-competency b{display:block;font-size:var(--type-row-title-size);font-weight:500}
    .pmt-stars{display:flex;gap:2px;margin-top:5px;color:#d8a536;font-size:12px}
    .pmt-competency small{display:block;margin-top:3px;color:#078c7f;font-size:var(--type-meta-size)}
    .pmt-certificate{margin-top:20px}
    .pmt-certificate-intro{display:flex;align-items:center;gap:10px}
    .pmt-certificate-intro>i{color:var(--orange)}
    .pmt-certificate-intro h2{margin:0;font-size:var(--type-section-title-size)}
    .pmt-certificate-intro span{padding:4px 10px;border-radius:999px;background:#e9f8f5;color:#078c7f;font-size:var(--type-meta-size)}
    .pmt-certificate>p{margin:9px 0 20px;color:#777f82}
    .pmt-certificate-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:24px;align-items:stretch}
    .certificate-preview{min-height:300px;padding:28px;border:1px solid #dce2e3;border-radius:8px;background:#fff;display:flex;flex-direction:column}
    .certificate-preview-top{display:flex;justify-content:space-between;align-items:center;color:#777f82;font-size:var(--type-meta-size);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
    .certificate-seal{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
    .certificate-name{margin-top:34px;font-size:var(--type-page-title-size);font-weight:500}
    .certificate-role{margin-top:3px;color:#4f5557}
    .certificate-role b{color:#087f89}
    .certificate-metrics{display:flex;gap:34px;margin-top:22px;padding:18px 0;border-top:1px solid #edf0f0;border-bottom:1px solid #edf0f0}
    .certificate-metrics strong{display:block;font-size:var(--type-row-title-size)}
    .certificate-metrics span{display:block;color:#777f82;font-size:var(--type-meta-size)}
    .certificate-code{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-top:auto;padding-top:20px}
    .certificate-code span{display:block;color:#777f82;font-size:10px}
    .certificate-code b{display:block;font-size:11px}
    .certificate-powered{text-align:right;color:#777f82;font-size:9px;letter-spacing:.12em;text-transform:uppercase}
    .certificate-powered b{color:#2fa1b3;font-size:18px;text-transform:none;letter-spacing:0}
    .certificate-benefits{display:flex;flex-direction:column}
    .certificate-benefits-title{font-size:var(--type-meta-size);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#666e71}
    .certificate-benefit{display:flex;align-items:flex-start;gap:12px;margin-top:19px;color:#4f5557}
    .certificate-benefit i{margin-top:4px;color:#0db198}
    .certificate-actions{margin-top:auto;padding-top:20px}
    .certificate-actions>.btn{width:100%}
    .certificate-secondary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
    .certificate-secondary .btn{width:100%}
    .pmt-opportunities{margin-top:20px}
    .pmt-opportunities h2{margin:0 0 8px;font-size:var(--type-section-title-size)}
    .opportunity-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:16px;padding:17px 0;border-top:1px solid #edf0f0}
    .opportunity-icon{width:42px;height:42px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
    .opportunity-copy b{display:block;font-size:var(--type-row-title-size);font-weight:500}
    .opportunity-copy span{display:block;margin-top:3px;color:#777f82;font-size:var(--type-supporting-size);font-weight:300}

    .submitted-ready-strip{display:flex;align-items:center;gap:12px;margin-top:28px;padding:17px 22px;border:1px solid #a9e4d8;border-radius:8px;background:#e9f8f5;color:#078c7f}
    .submitted-ready-strip b{font-size:var(--type-card-title-size);font-weight:500}
    .submitted-ready-strip button{margin-left:auto;border:0;background:none;color:var(--brand);font-weight:500}
    .application-card{margin-top:20px;padding:28px 30px}
    .application-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
    .application-card-head h2{margin:0;font-size:var(--type-page-title-size)}
    .application-card-head p{margin:4px 0 0;color:#777f82}
    .application-card-head button{border:0;background:none;color:var(--brand);font-weight:500}
    .application-timeline{display:grid;grid-template-columns:repeat(3,1fr);margin:34px 40px 0}
    .application-step{text-align:center;position:relative}
    .application-step:not(:last-child):after{content:"";position:absolute;top:26px;left:50%;right:-50%;border-top:2px dashed #dfe4e5}
    .application-step .application-step-dot{position:relative;z-index:1;width:56px;height:56px;margin:0 auto;border-radius:50%;background:#e9f8f5;color:#0db198;display:grid;place-items:center;font-size:19px;line-height:1}
    .application-step-dot i{display:block;line-height:1}
    .application-step.current .application-step-dot{background:var(--brand);color:#fff;box-shadow:0 0 0 5px #ccebef}
    .application-step b{display:block;margin-top:14px;font-size:var(--type-card-title-size);font-weight:500}
    .application-step>span:not(.application-step-dot){display:block;margin-top:2px;color:#777f82}
    .application-notice{display:flex;align-items:center;gap:14px;margin-top:28px;padding:18px 20px;border-radius:7px;background:#f4f5f6;color:#555d60}
    .application-notice i{color:var(--brand)}
    .waiting-heading{display:flex;align-items:center;gap:14px;margin-top:40px}
    .waiting-heading span{width:5px;height:34px;background:var(--orange)}
    .waiting-heading h2{margin:0;font-size:var(--type-page-title-size)}
    .waiting-description{margin:10px 0 0;color:#777f82}
    .waiting-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px}
    .waiting-card{min-height:330px;padding:28px;display:flex;flex-direction:column}
    .waiting-icon{width:54px;height:54px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:20px}
    .waiting-card h3{margin:22px 0 0;font-size:var(--type-section-title-size)}
    .waiting-card p{margin:10px 0 24px;color:#777f82;line-height:1.75}
    .waiting-card .btn{width:100%;margin-top:auto}
    /* Alignment and scale from the uploaded design source */

    .course-breadcrumb button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:0;color:#777f82;font-size:14px}
    .course-breadcrumb>i{font-size:9px;color:#c0c5c7}
    .course-breadcrumb span{font-weight:500;color:#343a3c}
    .course-header.reference{padding:28px 30px}

    .course-header.reference .course-description{font-size:14px;font-weight:300;color:#777f82;line-height:1.7;margin:10px 0 0;max-width:760px}
    .course-header.reference .module-track{display:flex;gap:14px;margin-top:22px}

<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <a class="portal-role-switch" href="/ta-portal" aria-label="Switch to TA portal"><i class="fa-solid fa-arrow-right-arrow-left"></i> TA portal</a>
  <script>
    const STUDENT_DEMO_CACHE_KEY="ai-talent-student-demo-v1";
    const STUDENT_DEMO_CACHE_VERSION=1;
    const DEFAULT_STUDENT_STATE={
      view:"login",persona:"student",onboardingIndex:0,cvUploaded:false,cvFileName:"",
      cvFileType:"",cvFileSize:0,cvFileData:"",analysisProgress:0,
      career:"Product Management Trainee",homeStage:"fresh",coursesCompleted:0,
      criteriaCompleted:0,points:0,activeCourse:1,answer:"",result:null,retries:2,profileTab:"overview",
      certificate:false,applicationStatus:"not-started",agentBusy:false,cvReview:null,
      journey:null,assignmentEvaluation:null,improvementPlan:null,nextAction:null,
      courseAttempts:{}
    };

    function restoreStudentState(){
      const fresh={...DEFAULT_STUDENT_STATE,courseAttempts:{}};
      if(typeof localStorage==="undefined") return fresh;
      try{
        const cached=JSON.parse(localStorage.getItem(STUDENT_DEMO_CACHE_KEY)||"null");
        if(cached?.version!==STUDENT_DEMO_CACHE_VERSION||!cached.state) return fresh;
        const restored={
          ...fresh,
          ...cached.state,
          courseAttempts:cached.state.courseAttempts&&typeof cached.state.courseAttempts==="object"
            ?cached.state.courseAttempts:{},
          cvFileData:"",
          agentBusy:false
        };
        const allowedViews=new Set(["login","onboarding","home","learning","course","result","profile","ready"]);
        if(!allowedViews.has(restored.view)) restored.view="home";
        return restored;
      }catch(error){
        return fresh;
      }
    }

    function persistStudentState(){
      if(typeof localStorage==="undefined") return;
      try{
        const {cvFileData,agentBusy,...cachedState}=state;
        localStorage.setItem(STUDENT_DEMO_CACHE_KEY,JSON.stringify({
          version:STUDENT_DEMO_CACHE_VERSION,
          savedAt:new Date().toISOString(),
          state:{...cachedState,cvFileData:"",agentBusy:false}
        }));
      }catch(error){
        // Demo persistence must never interrupt the product flow.
      }
    }

    const state=restoreStudentState();

    const icons={
      home:"fa-house",learning:"fa-book-open",assessment:"fa-list-check",
      profile:"fa-user",community:"fa-users"
    };

    const COURSE_CATALOG=[
      {
        number:1,title:"Product Fundamentals",
        description:"Nền tảng tư duy và kiến thức sản phẩm dành cho mọi PM.",
        icon:"fa-regular fa-lightbulb",criteria:3,maxPoints:15,time:"~2 giờ"
      },
      {
        number:2,title:"Structured & Critical Thinking",
        description:"Rèn tư duy logic, phản biện và hệ thống trước khi ra quyết định.",
        icon:"fa-solid fa-brain",criteria:3,maxPoints:15,time:"~2.5 giờ",
        competency:"Problem Solving",module:"Logical Thinking",
        modules:["Critical Thinking","Logical Thinking","System Thinking"],
        casePrompt:"Zalo đang cân nhắc thêm tính năng “Nhắc lịch tự động” vào Zalo Chat. Dữ liệu: 40% người dùng quên trả lời tin nhắn quan trọng, nhưng đội kỹ thuật chỉ có 2 tuần để làm MVP. Bạn sẽ quyết định nên làm hay không nên làm — và vì sao?"
      },
      {
        number:3,title:"User & Data Sense",
        description:"Hiểu người dùng và ra quyết định dựa trên dữ liệu.",
        icon:"fa-solid fa-chart-column",criteria:3,maxPoints:15,time:"~2.5 giờ",
        competency:"Customer Focus & Data Analytics",module:"Data Interpretation",
        modules:["User Insight","Metrics Thinking","Data Interpretation"],
        casePrompt:"Tỷ lệ kích hoạt người dùng mới giảm 12% sau khi onboarding được rút ngắn. Nhóm Growth muốn thêm ưu đãi ngay, trong khi nhóm Product muốn nghiên cứu lại hành vi. Bạn sẽ dùng dữ liệu nào, chọn hướng xử lý nào và đo kết quả ra sao?"
      },
      {
        number:4,title:"Ownership & Execution",
        description:"Ưu tiên, thực thi và tạo tác động — năng lực quản lý sản phẩm.",
        icon:"fa-solid fa-rocket",criteria:4,maxPoints:20,time:"~3 giờ",
        competency:"Execution & Stakeholder Management",module:"Execution Planning",
        modules:["Prioritization","Execution Planning","Stakeholder Alignment"],
        casePrompt:"Một tính năng quan trọng có nguy cơ trễ hai tuần vì phụ thuộc kỹ thuật. Sales đã cam kết ngày ra mắt với khách hàng, còn đội phát triển đề nghị giảm phạm vi. Bạn sẽ ưu tiên, phối hợp stakeholder và lập kế hoạch thực thi như thế nào?"
      }
    ];

    const COMPETENCY_CATALOG=[
      {icon:"fa-regular fa-lightbulb",name:"Product Thinking",courseNumber:1,criteria:3,maxPoints:15,color:"#078c7f"},
      {icon:"fa-solid fa-puzzle-piece",name:"Problem Solving",courseNumber:2,criteria:4,maxPoints:20,color:"#d2a438"},
      {icon:"fa-regular fa-user",name:"Customer Focus",courseNumber:3,criteria:1,maxPoints:5,color:"#078c7f"},
      {icon:"fa-solid fa-chart-column",name:"Data Sense",courseNumber:3,criteria:1,maxPoints:5,color:"#2fa1b3"},
      {icon:"fa-regular fa-comment-dots",name:"Communication",courseNumber:4,criteria:1,maxPoints:5,color:"#078c7f"},
      {icon:"fa-solid fa-flag-checkered",name:"Ownership",courseNumber:4,criteria:3,maxPoints:15,color:"#2fa1b3"}
    ];

    function courseData(number=state.activeCourse){
      return COURSE_CATALOG[number-1]||COURSE_CATALOG[0];
    }

    function courseStarScore(courseNumber){
      const recorded=Number(state.courseAttempts[courseNumber]?.evaluation?.score);
      if(Number.isFinite(recorded)&&recorded>=0) return Math.min(5,recorded);
      return courseNumber===1&&state.coursesCompleted>=1?4:0;
    }

    function competencyScores(){
      return COMPETENCY_CATALOG.map((competency,index)=>{
        const stars=courseStarScore(competency.courseNumber);
        const percent=Math.round((stars/5)*100);
        const courseState=courseStatus(competency.courseNumber);
        const status=courseState==="done"?"done":stars>0?"developing":courseState==="current"?"learning":"notstarted";
        return {...competency,index,stars,percent,status};
      });
    }

    function topCompetencies(limit=2){
      return competencyScores()
        .sort((left,right)=>right.percent-left.percent||left.index-right.index)
        .slice(0,limit);
    }

    function escapeHtml(value){
      return String(value??"").replace(/[&<>"']/g,(character)=>({

    function nameFromCvFilename(){
      const base=String(state.cvFileName||"")
        .replace(/\.(pdf|doc|docx)$/i,"")
        .replace(/[()[\]{}]/g," ")
        .replace(/[_–—-]+/g," ");
      const generic=/^(cv|resume|résumé|curriculum|vitae|profile|portfolio|product|pm|pmc)$/i;
      const tokens=base.split(/\s+/).filter(token=>token&&!generic.test(token));
      return tokens.join(" ").trim();
    }

    function studentInitial(){

    function studentVerificationCode(){
      const initials=studentFullName().split(/\s+/).filter(Boolean).map(part=>part.charAt(0))
        .join("").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/Đ/g,"D").replace(/đ/g,"d")
        .toUpperCase().slice(0,4)||"STU";
      return `PMT-2026-0A47-${initials}`;
    }

    async function callStudentAgent(agent,payload){
      const controller=new AbortController();
      const timeout=setTimeout(()=>controller.abort(),30000);
      try{
        const response=await fetch(`/api/student-agents/${agent}`,{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({payload:{studentId:state.cvFileName||"anonymous-student",...payload}}),
          signal:controller.signal
        });
        const body=await response.json().catch(()=>({}));
        if(!response.ok) throw new Error(body.code||"AGENT_UNAVAILABLE");
        return body;
      }finally{
        clearTimeout(timeout);
      }
    }

    async function uploadCv(input){
      const file=input.files?.[0];
      if(!file) return;
      if(!/\.(pdf|doc|docx)$/i.test(file.name)){
        input.value="";
        notify("Chỉ hỗ trợ tệp PDF, DOC hoặc DOCX.","error");
        return;
      }
      if(file.size>10*1024*1024){
        input.value="";
        notify("Tệp vượt quá giới hạn 10MB.","error");
        return;
      }
      try{
        const bytes=new Uint8Array(await file.arrayBuffer());
        let binary="";
        const chunkSize=0x8000;
        for(let offset=0;offset<bytes.length;offset+=chunkSize){
          binary+=String.fromCharCode(...bytes.subarray(offset,offset+chunkSize));
        }
        state.cvUploaded=true;
        state.cvFileName=file.name;
        state.cvFileType=file.type||(/\.pdf$/i.test(file.name)?"application/pdf":"application/vnd.openxmlformats-officedocument.wordprocessingml.document");
        state.cvFileSize=file.size;
        state.cvFileData=btoa(binary);
        state.cvReview=null;
        state.analysisProgress=0;
        render();
        notify(`Đã tải lên ${file.name}.`);
      }catch(error){
        input.value="";
        state.cvUploaded=false;
        state.cvFileName="";
        state.cvFileType="";
        state.cvFileSize=0;
        state.cvFileData="";
        notify("Không thể đọc tệp CV. Vui lòng thử lại.","error");
      }
    }

    async function runAnalysis(){
      if(state.agentBusy) return;
      state.agentBusy=true;
      state.cvReview=null;
      state.analysisProgress=8;
      render();
      const timer=setInterval(()=>{
        state.analysisProgress=Math.min(88,state.analysisProgress+Math.ceil(Math.random()*12));
        render();
      },360);
      try{
        const response=await callStudentAgent("cv-review",{
          persona:state.persona,
          cvUploaded:state.cvUploaded,
          cvFileName:state.cvFileName,
          ...(state.cvUploaded&&state.cvFileData?{
            cvFile:{
              filename:state.cvFileName,
              mimeType:state.cvFileType,
              size:state.cvFileSize,
              data:state.cvFileData
            }
          }:{}),
          onboarding:{
            school:"Đại học Ngoại thương",
            field:"Kinh doanh quốc tế",
            currentGoal:"Chuẩn bị cho chương trình Product Management Trainee"
          }
        });
        state.cvReview=response.output;
        state.analysisProgress=100;
        notify("AI đã hoàn tất trích xuất dữ liệu.");
      }catch(error){
        state.cvReview=null;
        state.analysisProgress=0;
        notifyAgentFailure();
      }finally{
        clearInterval(timer);
        state.agentBusy=false;
        render();
      }
    }

    async function nextOnboarding(){
      const flow=onboardingFlow();

      if(step==="cv"&&state.persona==="working"&&!state.cvUploaded){notify("Vui lòng tải CV để tiếp tục.");return;}
      if(step==="analysis"&&(state.analysisProgress<100||!state.cvReview||state.agentBusy)){return;}
      if(step==="cv"){
        state.onboardingIndex++;
        render();
        window.scrollTo({top:0,behavior:"smooth"});
        if(!state.cvReview) setTimeout(()=>runAnalysis(),0);
        return;

      if(flow[state.onboardingIndex+1]==="journey") state.journey=demoJourney();
      if(state.onboardingIndex<flow.length-1){state.onboardingIndex++;render();window.scrollTo({top:0,behavior:"smooth"});}
