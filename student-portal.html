    function home(){
      if(state.applicationStatus==="submitted") return submittedHome();
      const shortName=escapeHtml(studentShortName());
      const initial=escapeHtml(studentInitial());
      const active=state.coursesCompleted>=1;
      const score=readinessScore();
      const courseNo=active?nextCourseNumber():1;
      const currentCourse=courseData(courseNo);
      const courseIcon=currentCourse.icon,courseTitle=currentCourse.title,courseDescription=currentCourse.description;
      const competencies=competencyScores().map(competency=>{
        const hasScore=competency.stars>0;
        const meta=hasScore
          ?`${competency.stars}/5★ · ${competency.percent}% năng lực`
          :`0/${competency.criteria} tiêu chí · 0/${competency.maxPoints}đ`;
        const status=competency.status==="developing"||competency.status==="learning"?"learning":competency.status;
        const note=competency.status==="done"
          ?`Điểm Course ${competency.courseNumber}: ${competency.stars}/5★`
          :hasScore
            ?`Kết quả gần nhất ở Course ${competency.courseNumber}`
            :competency.status==="learning"
              ?`Đang phát triển ở Course ${competency.courseNumber}`
              :"";
        return [competency.icon,competency.name,meta,competency.percent,status,note];
      });
      const stats=[[`${state.coursesCompleted}/4`,"khóa học"],[`${state.criteriaCompleted}/13`,"tiêu chí"],[`${state.points}/65`,"điểm"]];
      const goal=active?`<section class="sh-goal-strip"><span class="sh-goal-strip-icon"><i class="fa-solid fa-bullseye"></i></span><div class="sh-goal-strip-copy"><b>Mục tiêu: Product Management Trainee (PMT)</b><span>13 tiêu chí · 65 điểm tối đa</span></div><button class="btn btn-outline" style="background:#fff" onclick="route('learning')">Xem lộ trình chi tiết <i class="fa-solid fa-arrow-right"></i></button></section>`:
      `<section class="sh-goal-hero"><div class="sh-goal-copy"><div class="sh-goal-label">Mục tiêu của bạn</div><div class="sh-goal-title">Product Management Trainee (PMT)</div><div class="sh-goal-description">Hoàn thành 4 khóa học và 13 tiêu chí rubric để đạt trạng thái “PMT Ready”.</div><div class="sh-goal-pills"><span class="sh-goal-pill"><i class="fa-solid fa-book-open"></i><b>4</b> khóa học</span><span class="sh-goal-pill"><i class="fa-solid fa-puzzle-piece"></i><b>13</b> tiêu chí rubric</span><span class="sh-goal-pill"><i class="fa-solid fa-flag"></i><b>PMT Ready</b> mục tiêu</span></div><button class="btn btn-orange" style="margin-top:22px" onclick="startLearning()">Bắt đầu Course 1 <i class="fa-solid fa-arrow-right"></i></button></div><span class="sh-goal-visual"><i class="fa-solid fa-bullseye"></i></span></section>`;
      const guide=active?"":`<section class="sh-guide"><div class="sh-guide-title">Cách đạt PMT Ready</div><div class="sh-guide-steps">${[["fa-book-open","Học khóa học","Bài học, quiz, bài tập"],["fa-puzzle-piece","Hoàn thành rubric","Đạt điểm từng tiêu chí"],["fa-regular fa-star","Tích điểm","Tối đa 65đ / 13 rubric"],["fa-flag","PMT Ready","Đủ điều kiện ứng tuyển"]].map(([icon,title,desc],i)=>`<div class="sh-guide-step"><div class="sh-guide-copy"><span class="sh-guide-icon"><i class="${icon.startsWith("fa-regular")?icon:`fa-solid ${icon}`}"></i></span><b>${title}</b><span>${desc}</span></div>${i<3?'<i class="fa-solid fa-arrow-right sh-guide-arrow"></i>':""}</div>`).join("")}</div><button class="sh-guide-link" onclick="route('learning')">Xem lộ trình & rubric chi tiết →</button></section>`;
      const body=`<header class="sh-top"><div><h1 class="sh-greeting">Chào ${shortName}</h1><p class="sh-intro">${isReady()?"Bạn đã hoàn thành lộ trình Product Management và đạt trạng thái PMT Ready.":active?`Bạn đã hoàn thành ${state.coursesCompleted}/4 khóa học — Course ${courseNo} đang mở để tiếp tục.`:"Chào mừng bạn đến với lộ trình Product Management."}</p></div><div class="sh-top-actions"><button class="sh-round-action" onclick="notify('${active?"Tiến độ học tập của bạn đã được đồng bộ.":"Bạn chưa có thông báo mới."}')"><i class="fa-regular fa-bell"></i>${active?'<span class="sh-notice">1</span>':""}</button><span class="sh-user">${initial}</span></div></header>
      ${goal}
      <section class="sh-two-col"><article class="sh-course-card"><span class="sh-course-icon"><i class="${courseIcon}"></i></span><div class="sh-course-copy"><span class="sh-course-tag">Course ${courseNo}</span><div class="sh-course-title">${courseTitle}</div><div class="sh-course-description">${isReady()?"Toàn bộ lộ trình đã hoàn thành.":courseDescription}</div>${active&&!isReady()?'<div class="sh-course-progress"><span style="width:33%"></span></div>':""}<div class="sh-course-meta"><span><i class="fa-regular fa-clock"></i>${currentCourse.time}</span><span><i class="fa-solid fa-puzzle-piece"></i>${currentCourse.criteria} rubrics</span><span><i class="fa-regular fa-star"></i>${currentCourse.maxPoints} điểm</span></div><button class="btn btn-orange" style="margin-top:20px" onclick="${isReady()?"route('ready')":"startLearning()"}">${isReady()?"Xem PMT Ready":active?"Tiếp tục":"Bắt đầu học"} <i class="fa-solid fa-arrow-right"></i></button></div></article>
      <article class="sh-progress-card"><div class="sh-progress-head"><div class="sh-ring" style="--value:${score}"><div class="sh-ring-copy"><strong>${score}</strong><span>/100</span></div></div><div class="sh-progress-copy"><b>Tiến độ hiện tại</b><span>${isReady()?"PMT Ready — toàn bộ lộ trình đã hoàn thành.":active?`${score}/100 readiness — tiếp tục Course ${courseNo} để tiến gần mục tiêu.`:"Bạn chưa có hoạt động nào."}</span></div></div><div class="sh-progress-divider"></div><div class="sh-progress-stats">${stats.map(([value,label])=>`<div class="sh-progress-stat"><strong>${value}</strong><span>${label}</span></div>`).join("")}</div><button class="sh-score-link" onclick="route('profile')">Hiểu cách chấm điểm →</button></article></section>
      ${guide}
      <section class="sh-section-head"><span class="sh-section-bar"></span><div class="sh-section-title">6 năng lực cốt lõi của PM</div></section><div class="sh-section-description">Mỗi năng lực gồm 1 hoặc nhiều tiêu chí rubric — hoàn thành hết mới tính là đạt năng lực đó.</div>
      <section class="sh-competency-grid">${competencies.map(([icon,name,meta,pct,status,note])=>`<article class="sh-competency"><span class="sh-competency-icon"><i class="${icon}"></i></span><div class="sh-competency-name">${name}</div><div class="sh-competency-meta">${meta}</div><div class="sh-competency-progress"><span style="width:${pct}%"></span></div><div class="sh-competency-status ${status}"><span class="sh-status-dot"></span>${status==="done"?"Đã hoàn thành":status==="learning"?"Đang phát triển":"Chưa bắt đầu"}</div>${note?`<div class="sh-competency-note">${note}</div>`:""}</article>`).join("")}</section>`;
      return shell(body,"home-portal",active?"AI Talent":"ZA AI Talent");
    }

    function startLearning(){
      state.homeStage="progress";
      if(isReady()) return route("ready");
      openLearningCourse(nextCourseNumber());
    }

    function courseStatus(n){
      if(n<=state.coursesCompleted) return "done";
      if(n===state.coursesCompleted+1) return "current";
      return "locked";
    }

    function learning(){
      const courses=COURSE_CATALOG;
      const progressPct=Math.min(100,Math.round((state.points/65)*100));
      const rows=courses.map((course,index)=>{
        const n=index+1,status=courseStatus(n);
        const earned=status==="done"?course.maxPoints:0;
        const points=status==="locked"?`–/${course.maxPoints}đ`:`${earned}/${course.maxPoints}đ`;
        const tag=status==="done"?`Course ${n} · Hoàn thành`:status==="current"?`Course ${n} · Đang học`:`Course ${n} · Chưa mở khoá`;
        const action=status==="done"
          ?`<button class="btn btn-outline" onclick="reviewLearningCourse(${n})">Xem lại <i class="fa-solid fa-arrow-right"></i></button>`
          :status==="current"
            ?`<button class="btn btn-orange" onclick="openLearningCourse(${n})">${n===1?"Bắt đầu":"Tiếp tục"} <i class="fa-solid fa-arrow-right"></i></button>`
            :`<div class="li-lock-note"><i class="fa-solid fa-lock"></i>Hoàn thành Course ${n-1} để mở khoá</div>`;
        const segments=status==="current"&&n===2?`<div class="li-segments"><span class="done"></span><span class="current"></span><span></span></div>`:"";
        return `<article class="li-course ${status}">
          <span class="li-course-icon"><i class="${course.icon}"></i></span>
          <div class="li-course-copy"><span class="li-course-tag">${tag}</span><div class="li-course-name">${course.title}</div><div class="li-course-description">${course.description}</div><div class="li-course-meta"><span><i class="fa-solid fa-puzzle-piece"></i>${course.criteria} tiêu chí</span><span><i class="fa-solid fa-star"></i>${course.maxPoints} điểm</span><span><i class="fa-regular fa-clock"></i>${course.time}</span></div>${segments}</div>
          <div class="li-course-side"><div class="li-course-points">${points}</div>${action}</div>
        </article>`;
      }).join("");
      const body=`<h1 class="li-title">Learning</h1>
      <p class="li-subtitle">Lộ trình 4 khóa học để đạt PMT Ready — hoàn thành 13 tiêu chí, tối đa 65 điểm.</p>
      <section class="li-summary"><div class="li-summary-count"><strong>${state.coursesCompleted}/4</strong><span>course xong</span></div><div class="li-summary-progress"><div class="li-summary-labels"><span>${state.criteriaCompleted}/13 tiêu chí</span><b>${state.points}/65 điểm</b></div><div class="li-summary-track"><span style="width:${progressPct}%"></span></div></div></section>
      <section class="li-panel"><div class="li-assessment"><span class="li-assessment-icon"><i class="fa-solid fa-clipboard-list"></i></span><div class="li-assessment-title">Bài đánh giá đầu vào</div><span class="li-assessment-status"><i class="fa-solid fa-check"></i>Đã hoàn thành</span></div>${rows}<div class="li-note"><i class="fa-regular fa-lightbulb"></i><span>Course mở tuần tự — hoàn thành đủ tiêu chí của course trước để mở course tiếp theo. Điểm rubric cộng trực tiếp vào readiness của bạn.</span></div></section>`;
      return shell(body,"learning-index-portal","Zalo Talent");
    }

    function openLearningCourse(n){
      if(n!==state.coursesCompleted+1) return;
      if(n===1) return completeCourse(1);
      state.activeCourse=n;
      state.answer="";
      state.result=state.courseAttempts[n]?.result||null;
      state.assignmentEvaluation=state.courseAttempts[n]?.evaluation||null;
      state.improvementPlan=state.courseAttempts[n]?.improvementPlan||null;
      state.nextAction=state.courseAttempts[n]?.nextAction||null;
      route("course");
    }

    function reviewLearningCourse(n){
      if(n===1) return notify("Course 1 đã hoàn thành.");
      state.activeCourse=n;
      state.result=state.courseAttempts[n]?.result||"pass";
      state.assignmentEvaluation=state.courseAttempts[n]?.evaluation||null;
      route("course");
    }

    function completeCourse(n,{stayOnResult=false}={}){
      if(n!==state.coursesCompleted+1) return;
      state.coursesCompleted=n;
      syncLearningProgress();
      notify(`Course ${n} đã hoàn thành.`);
      if(stayOnResult) return;
      if(isReady()) route("ready"); else route("learning");
    }

    function course(){
      const current=courseData();
      const rubric=[
        [5,"Lập luận đa tầng, tự phản biện giả định, có phương án dự phòng."],
        [4,"Lập luận chặt chẽ, xét giả định & rủi ro, dẫn chứng cụ thể."],
        [3,"Có cấu trúc cơ bản, chưa xét trường hợp ngoại lệ."],
        [2,"Lập luận rời rạc, thiếu liên kết giữa các bước."],
        [1,"Chỉ đưa ra kết luận, không có lập luận rõ ràng."]
      ];
      const stars=n=>Array.from({length:5},(_,i)=>`<i class="${i<n?"fa-solid":"fa-regular"} fa-star ${i<n?"":"empty"}"></i>`).join("");
      const body=`<nav class="course-breadcrumb" aria-label="Breadcrumb">
        <button onclick="route('home')"><i class="fa-solid fa-house"></i>Home</button><i class="fa-solid fa-chevron-right"></i>
        <button onclick="route('learning')"><i class="fa-solid fa-book-open"></i>Learning</button><i class="fa-solid fa-chevron-right"></i><span>Course ${current.number}</span>
      </nav>
      <section class="card course-header reference">
        <span class="tag">Course ${current.number} · ${courseStatus(current.number)==="done"?"Hoàn thành":"Đang học"}</span>
        <div class="course-title">${current.title}</div>
        <p class="course-description">Bạn sẽ phát triển ${current.criteria} tiêu chí trong khóa học này — đóng góp vào năng lực ${current.competency}.</p>
        <div class="module-track">
          <div class="module-tile done"><span class="module-state-icon"><i class="fa-solid fa-check"></i></span><div><b>1. ${current.modules[0]}</b><span>Hoàn thành</span></div></div>
          <div class="module-tile current"><span class="module-state-icon"><i class="fa-solid fa-play"></i></span><div><b>2. ${current.module}</b><span>Đang học</span></div></div>
          <div class="module-tile locked"><span class="module-state-icon"><i class="fa-solid fa-lock"></i></span><div><b>3. ${current.modules[2]}</b><span>Chưa mở khoá</span></div></div>
        </div>
        <div class="course-summary-line"><span>2/3 module hoàn thành</span><b>${Math.floor(current.maxPoints*.53)}/${current.maxPoints}đ</b></div>
        <div class="progress" style="margin-top:10px;height:8px"><span style="width:53%"></span></div>
      </section>
      <section class="course-layout reference">
        <article class="card lesson-card">
          <div class="lesson-module-head"><span class="lesson-module-number">2</span><h2>${current.module}</h2><span class="tag">Đang học</span></div>
          <p class="course-description" style="margin-top:12px">${current.description}</p>
          <div class="lesson-target"><i class="fa-solid fa-bullseye target-icon"></i><span>Mục tiêu: đạt tối thiểu</span><span class="target-stars">${stars(4)}</span><span class="muted">(4/5)</span></div>
          <div class="task-list">
            <div class="task done"><i class="fa-solid fa-check task-status"></i><div><b>Bài đọc</b><span>Đã hoàn thành</span></div></div>
            <div class="task done"><i class="fa-solid fa-check task-status"></i><div><b>Quiz củng cố</b><span>5/5 điểm</span></div></div>
            <div class="task current"><i class="fa-solid fa-play task-status"></i><div><b>Case thực hành</b><a href="#caseAnswer">Quyết định điểm rubric của bạn →</a></div></div>
          </div>
          <div class="case-reference"><div class="case-label">Case study</div><p>${current.casePrompt}</p></div>
          <div class="hint-label">Gợi ý cấu trúc trả lời</div>
          <div class="answer-hints">${["Vấn đề","Lựa chọn","Đánh đổi","Đề xuất"].map((label,i)=>`<div class="answer-hint"><span>${i+1}</span><b>${label}</b></div>`).join("")}</div>
          <textarea id="caseAnswer" class="answer-box" placeholder="Nhập câu trả lời của bạn...">${state.answer}</textarea>
          <div class="answer-help">Trả lời càng bám theo cấu trúc trên, điểm rubric càng cao.</div>
          <button class="btn course-submit" onclick="submitCase()">Nộp bài chấm điểm <i class="fa-solid fa-arrow-right"></i></button>
        </article>
        <aside class="course-side">
          <div class="card rubric-card"><h2>Rubric: ${current.module}</h2><div class="rubric-stars-list">${rubric.map(([n,desc])=>`<div class="rubric-stars-row"><span class="rubric-stars">${stars(n)}</span><p>${desc}</p></div>`).join("")}</div></div>
          <div class="rewards-card"><h2>Sau khi hoàn thành</h2><div class="reward-list"><div class="reward-row"><i class="fa-regular fa-star"></i><span>+${current.maxPoints} điểm course</span></div><div class="reward-row"><i class="fa-solid fa-lock-open"></i><span>${current.number<4?`Mở khoá: Course ${current.number+1}`:"Mở trạng thái PMT Ready"}</span></div><div class="reward-row"><i class="fa-solid fa-arrow-trend-up"></i><span>Đồng bộ Home và Talent Profile</span></div></div></div>
        </aside>
      </section>`;
      return shell(body);

    async function submitCase(){
      const textarea=document.querySelector("#caseAnswer");
      state.answer=textarea.value.trim();
      if(!state.answer){notify("Vui lòng nhập câu trả lời trước khi nộp.");return;}
      const current=courseData();

          {section:"Đề xuất",status:passed?"met":"missing",evidence:"",feedback:passed?"Đề xuất có bước tiếp theo.":"Cần kết luận rõ và có tiêu chí đo lường."}

    function result(){
      const passed=state.result==="pass";
      const evaluation=state.assignmentEvaluation;

      const score=Number(evaluation.score);

      const structure=evaluation.structureResults.map(item=>{
        const presentation={met:["ok","fa-solid fa-check"],partial:["partial","fa-solid fa-circle-half-stroke"],missing:["missing","fa-solid fa-xmark"]}[item.status];
        return [...presentation,item.section,item.feedback,item.evidence];
      });
      const progress=passed?[
        [`Course ${current.number}: ${current.title}`,`${current.maxPoints}/${current.maxPoints}đ`,"100%",`Course ${current.number} đã hoàn thành`],

        [`Course ${current.number}: ${current.title}`,`0/${current.maxPoints}đ`,"0%","Chưa cộng điểm — cần tối thiểu 4/5★"],

      ];

      const improvementActions=state.improvementPlan?.actions?.map((action,index)=>[
          String(index+1),action.title,action.reason,`~${action.minutes} phút`
        ])||[];
      const evidenceBlock=evaluation.evidenceHighlights.length?`<div class="lr-evidence-list">${evaluation.evidenceHighlights.map(item=>`<div class="lr-evidence-item"><q>${escapeHtml(item.quote)}</q><span>${escapeHtml(item.whyItMatters)}</span></div>`).join("")}</div>`:'<div class="agent-empty">Không có đoạn trích để hiển thị.</div>';
      const gapBlock=evaluation.gaps.length?`<div class="lr-gap-label">Khoảng trống cần cải thiện</div><div class="lr-gap-list">${evaluation.gaps.map(gap=>`<div class="lr-gap"><i class="fa-solid fa-triangle-exclamation"></i><div><span>${escapeHtml(gap)}</span></div></div>`).join("")}</div>`:"";
      const strengthBlock=evaluation.strengths.length?`<div class="lr-tip"><i class="fa-regular fa-lightbulb"></i><div><b>Điểm làm tốt:</b> ${escapeHtml(evaluation.strengths.join(" · "))}</div></div>`:"";
      const planBlock=passed?"":state.improvementPlan?`
        <div class="lr-plan"><div class="lr-plan-head"><b>${escapeHtml(state.improvementPlan.headline)}</b><span>tổng ~${state.improvementPlan.estimatedMinutes} phút</span></div>
          <div class="lr-ai-summary">${escapeHtml(state.improvementPlan.gapSummary)}</div>
          ${improvementActions.map(([n,title,desc,time])=>`<div class="lr-plan-row"><span class="lr-plan-number">${escapeHtml(n)}</span><div class="lr-plan-copy"><b>${escapeHtml(title)}</b><span>${escapeHtml(desc)}</span></div><span class="lr-plan-time">${escapeHtml(time)}</span></div>`).join("")}
          <div class="lr-tip"><i class="fa-regular fa-lightbulb"></i><div>${escapeHtml(state.improvementPlan.retryAdvice)}</div></div>
        </div>`:"";
      const coachBody=`
        <div class="lr-ai-summary">${escapeHtml(evaluation.summary)}</div>
        <div class="lr-rubric-quote"><div class="lr-block-label">Mức ${score}/${evaluation.maxScore} — theo rubric</div><div class="lr-block-copy">“${escapeHtml(evaluation.rubricLevel)}”</div></div>
        <div class="lr-gap-label">Câu trả lời được dùng cho kết quả demo</div>
        ${evidenceBlock}${strengthBlock}${gapBlock}${planBlock}
        <div class="lr-confidence"><span class="agent-pill">Chế độ: Demo local</span><span class="agent-pill">${escapeHtml(evaluation.confidenceReason)}</span></div>`;
      const nextAction=state.nextAction;
      const body=`<nav class="course-breadcrumb lr-breadcrumb" aria-label="Breadcrumb">
        <button onclick="route('home')">Home</button><i class="fa-solid fa-chevron-right"></i>
        <button onclick="route('learning')">Learning</button><i class="fa-solid fa-chevron-right"></i>
        <button onclick="route('course')">Course ${current.number}</button><i class="fa-solid fa-chevron-right"></i>
        <span>${current.module} · Kết quả</span>
      </nav>
      <section class="lr-score ${passed?"pass":"fail"}">
        <span class="lr-score-icon"><i class="fa-solid ${passed?"fa-circle-check":reviewing?"fa-user-clock":"fa-circle-exclamation"}"></i></span>
        <div class="lr-score-title">${passed?"Đã chấm điểm xong!":reviewing?"Đang chờ kiểm tra thủ công":"Chưa đạt mục tiêu — thử lại nhé"}</div>
        <div class="lr-stars">${stars}</div>
        <div class="lr-score-target">Mục tiêu: tối thiểu <b>4/5★</b> — bạn đạt <strong>${score}/5★</strong></div>
        <div class="lr-result-pill ${passed?"pass":"fail"}"><i class="${passed?"fa-regular fa-star":"fa-solid fa-lock"}"></i>${passed?`+${score}/5 điểm rubric`:reviewing?"Chưa cộng điểm · chờ xác nhận":"Chưa cộng điểm rubric"}</div>
        ${passed?"":`<div class="lr-agent-note"><i class="fa-solid fa-rotate"></i>Kết quả demo chưa đạt · bạn có thể làm lại</div>`}
      </section>
      <section class="lr-coach">
        <div class="lr-coach-head"><span class="lr-coach-icon"><i class="fa-solid fa-flask"></i></span><div class="lr-coach-title"><b>Demo Review</b><span>Kết quả mô phỏng cục bộ — không gọi AI Agent</span></div><span class="lr-coach-status ${passed?"pass":""}"><span class="lr-coach-status-dot"></span>${passed?"Đạt":"Chưa đạt"}</span></div>
        <div class="lr-coach-body">${coachBody}</div>

      <section class="lr-structure"><div class="lr-card-head"><h2>Cấu trúc bài làm của bạn</h2><span>Demo đối chiếu ${structure.length} phần</span></div><div class="lr-structure-list">${structure.map(([status,icon,label,note,evidence])=>`<div class="lr-structure-row ${status}"><i class="${icon}"></i><div class="lr-structure-copy"><b>${escapeHtml(label)}</b><span>${escapeHtml(note)}</span>${evidence?`<span><i class="fa-solid fa-quote-left"></i> ${escapeHtml(evidence)}</span>`:""}</div></div>`).join("")}</div></section>
      <section class="lr-progress-card ${passed?"pass":"fail"}"><div class="lr-card-head"><h2>${passed?"Cập nhật tiến độ":"Tiến độ chưa thay đổi"}</h2></div><div class="lr-progress-list">${progress.map(([label,value,width,delta])=>`<div class="lr-progress-row"><div class="lr-progress-top"><span>${label}</span><b>${value}</b></div><div class="lr-progress-track"><span style="width:${width}"></span></div><div class="lr-progress-delta">${delta}</div></div>`).join("")}</div><div class="lr-actions"><button class="btn btn-outline" onclick="route('course')">${passed?"Xem lại bài làm":"Xem lại bài đọc"}</button></div></section>

      return shell(body,"learning-result-portal","AI Talent");

    function useCoachPrompt(prompt){
      const input=document.querySelector(".lr-coach-input");
      if(!input) return;
      input.value=prompt;
      input.focus();
    }

    function askCoach(){
      const input=document.querySelector(".lr-coach-input");
      if(!input||!input.value.trim()) return notify("Hãy nhập câu hỏi cho AI Coach.");
      notify("Hỏi đáp với AI Coach sẽ được mở trong phiên bản tiếp theo.");
    }

    function runRecommendedAction(){
      const actionId=state.nextAction?.actionId;
      if(actionId==="continue-next-course") return route("learning");
      if(actionId==="view-pmt-ready") return route("ready");
      if(actionId==="retry-current-course") return retryCase();
      if(actionId==="continue-system-thinking") return continueAfterPass();
      if(actionId==="retry-logical-thinking") return retryCase();
      if(actionId==="review-tradeoffs") return route("course");
      route("learning");
    }

    function continueAfterPass(){
      route("learning");
      notify("System Thinking đã được mở khóa.");
    }

    function retryCase(){
      state.retries=Math.max(0,state.retries-1);
      route("course");
      notify("Case đã sẵn sàng để bạn làm lại.");
    }

      });
      const competencyTab=`<section class="tp-tab-layout"><div class="tp-tab-main">
        <article class="card tp-tab-card"><div class="tp-card-heading"><div><h2>6 năng lực cốt lõi</h2><p>Điểm được tổng hợp từ rubric, khóa học và bài đánh giá.</p></div><span class="tp-status current">Baseline</span></div>
        ${competencies.map(([icon,name,note,value,color])=>`<div class="tp-competency-row"><span class="tp-competency-icon"><i class="${icon}"></i></span><div class="tp-competency-copy"><b>${name}</b><span>${note}</span></div><div class="tp-competency-value"><strong style="color:${color}">${value}%</strong><div class="tp-mini-bar"><span style="width:${value}%;background:${color}"></span></div></div></div>`).join("")}</article>
      </div><aside class="tp-tab-side">
        <article class="card tp-tab-card"><div class="tp-card-heading"><div><h2>Phân bổ cấp độ</h2><p>Tình trạng hiện tại của 6 năng lực.</p></div></div><div class="tp-distribution"><div class="tp-distribution-row"><span>Mạnh</span><div class="progress"><span style="width:${Math.round((strongCount/6)*100)}%;background:#078c7f"></span></div><b>${strongCount}</b></div><div class="tp-distribution-row"><span>Đang phát triển</span><div class="progress"><span style="width:${Math.round((developingCount/6)*100)}%"></span></div><b>${developingCount}</b></div><div class="tp-distribution-row"><span>Khởi tạo</span><div class="progress"><span style="width:${Math.round((startingCount/6)*100)}%;background:#a0a6a8"></span></div><b>${startingCount}</b></div></div></article>
        <article class="tp-focus"><span class="tp-status current">Ưu tiên tiếp theo</span><h2 style="margin-top:12px">${isReady()?"Ứng tuyển PMT":nextCourse.title}</h2><p>${isReady()?"Hồ sơ đã hoàn tất toàn bộ tiêu chí.":`Hoàn thành Course ${nextCourse.number} để mở khóa bước tiếp theo.`}</p><button class="btn btn-primary btn-sm" onclick="${isReady()?"route('ready')":"startLearning()"}">${isReady()?"Xem PMT Ready":"Tiếp tục học"} <i class="fa-solid fa-arrow-right"></i></button></article>
        <article class="card tp-tab-card"><div class="tp-card-heading"><div><h2>Nguồn bằng chứng</h2><p>Những hoạt động đang đóng góp vào hồ sơ.</p></div></div><div class="tp-score-impact"><i class="fa-solid fa-book-open"></i><div><b>Khóa học</b><span>${state.coursesCompleted} khóa hoàn thành</span></div><b>+${state.points}đ</b></div><div class="tp-score-impact"><i class="fa-solid fa-clipboard-check"></i><div><b>Rubric</b><span>${state.criteriaCompleted} tiêu chí đã xác minh</span></div><b>${state.criteriaCompleted}/13</b></div><div class="tp-score-impact"><i class="fa-solid fa-list-check"></i><div><b>Đánh giá</b><span>${Object.keys(state.courseAttempts).length} case demo đã nộp</span></div><b>${level}</b></div></article>
      </aside></section>`;
      const rubricDefinitions=[
        ["Product Thinking",1,["Problem Framing","Value Thinking","Solution Evaluation"]],
        ["Problem Solving",2,["Critical Thinking","Logical Thinking","System Thinking"]],
        ["Customer & Data",3,["User Insight","Metrics Thinking","Data Interpretation"]],
        ["Execution & Management",4,["Ownership","Prioritization","Communication","Stakeholder Management"]]
      ];
      const rubricGroups=rubricDefinitions.map(([group,courseNumber,names])=>{
        const courseState=courseStatus(courseNumber);
        const completed=courseState==="done"?names.length:0;
        const rows=names.map((name,index)=>{
          if(courseState==="done") return ["done","fa-check",name,"Đã xác minh","+5đ"];
          if(courseState==="current"&&index===0) return ["current","fa-play",name,"Đang phát triển","0/5"];
          return ["locked","fa-lock",name,courseState==="current"?"Chưa hoàn thành":"Chưa mở khóa","—"];
        });
        return [group,`${completed}/${names.length} hoàn thành`,rows];
      });
      const rubricTab=`<section class="card tp-summary-grid" style="margin-top:24px"><div class="tp-summary-item"><strong>${state.criteriaCompleted}/13</strong><span>Rubric hoàn thành</span></div><div class="tp-summary-item"><strong>${state.points}/65</strong><span>Điểm rubric</span></div><div class="tp-summary-item"><strong>${remainingCriteria}</strong><span>Rubric còn lại</span></div></section>
      <section class="tp-tab-layout"><div class="tp-tab-main"><article class="card tp-tab-card"><div class="tp-card-heading"><div><h2>Bộ rubric PMT Ready</h2><p>13 tiêu chí được xác minh bằng bằng chứng cụ thể.</p></div><span class="tp-status current">${state.criteriaCompleted}/13 xong</span></div>
      ${rubricGroups.map(([group,meta,rows])=>`<div class="tp-rubric-group"><div class="tp-rubric-group-head"><h3>${group}</h3><span>${meta}</span></div>${rows.map(([status,icon,name,note,points])=>`<div class="tp-rubric-row"><span class="tp-rubric-dot ${status}"><i class="fa-solid ${icon}"></i></span><div class="tp-rubric-copy"><b>${name}</b><span>${note}</span></div><span class="tp-rubric-points" style="${status==="locked"?"color:#949a9c":""}">${points}</span></div>`).join("")}</div>`).join("")}</article></div>
      <aside class="tp-tab-side"><article class="card tp-tab-card"><div class="tp-card-heading"><div><h2>Trạng thái rubric</h2><p>Cách đọc tiến độ của từng tiêu chí.</p></div></div><div class="tp-legend"><div class="tp-legend-row"><span class="tp-rubric-dot done"><i class="fa-solid fa-check"></i></span>Đã có đủ bằng chứng</div><div class="tp-legend-row"><span class="tp-rubric-dot current"><i class="fa-solid fa-play"></i></span>Đang phát triển</div><div class="tp-legend-row"><span class="tp-rubric-dot locked"><i class="fa-solid fa-lock"></i></span>Chưa mở khóa</div></div></article><article class="tp-focus"><span class="tp-status current">Gần nhất</span><h2 style="margin-top:12px">System Thinking</h2><p>Hoàn thành module hiện tại để mở rubric thứ 4 và tiến gần ngưỡng Emerging.</p><button class="btn btn-primary btn-sm" onclick="route('course')">Mở module <i class="fa-solid fa-arrow-right"></i></button></article></aside></section>`;
      const events=[
        ["fa-solid fa-puzzle-piece","Hoàn thành rubric “Phân tích vấn đề”","Problem Solving · +5 điểm","2 ngày trước"],
        ["fa-solid fa-chart-line",`Readiness hiện tại ${score}/100`,"Đồng bộ từ tiến độ Learning","Hiện tại"],
        ["fa-solid fa-book-open","Hoàn thành Product Fundamentals","3 rubric · 15/15 điểm","5 ngày trước"],
        ["fa-regular fa-star",state.assignmentEvaluation?`Kết quả ${state.assignmentEvaluation.score}/5★ ${courseData().module}`:"Chưa nộp case","Kết quả demo local","Gần đây"],
        ["fa-solid fa-bullseye","Xác nhận mục tiêu học tập","Product Management","12/05/2025"],
        ["fa-regular fa-file-lines","Tải lên CV","CV không bắt buộc · đã phân tích","12/05/2025"]
      ];
      const historyTab=`<section class="tp-tab-layout"><div class="tp-tab-main"><article class="card tp-tab-card"><div class="tp-card-heading"><div><h2>Dòng hoạt động</h2><p>Những thay đổi đã đóng góp vào hồ sơ năng lực.</p></div><span class="tp-status done">${events.length} hoạt động</span></div><div class="tp-timeline">${events.map(([icon,title,meta,time])=>`<div class="tp-event"><span class="tp-event-icon"><i class="${icon}"></i></span><div class="tp-event-copy"><b>${title}</b><span>${meta}</span></div><span class="tp-event-time">${time}</span></div>`).join("")}</div></article></div>
      <aside class="tp-tab-side"><article class="card tp-tab-card"><div class="tp-card-heading"><div><h2>Lọc hoạt động</h2><p>Xem theo loại bằng chứng.</p></div></div><div class="tp-filter-pills"><button class="active">Tất cả</button><button>Học tập</button><button>Rubric</button><button>Hồ sơ</button></div></article><article class="card tp-tab-card"><div class="tp-card-heading"><div><h2>Tiến độ hiện tại</h2><p>Tóm tắt hoạt động của bạn.</p></div></div><div class="tp-month-stat"><span>Điểm tích lũy</span><b style="color:#078c7f">${state.points}đ</b></div><div class="tp-month-stat"><span>Rubric hoàn thành</span><b>${state.criteriaCompleted}</b></div><div class="tp-month-stat"><span>Khóa học hoàn thành</span><b>${state.coursesCompleted}</b></div><div class="tp-month-stat"><span>Readiness</span><b>${score}</b></div></article><article class="tp-focus"><h2>Dữ liệu thuộc về bạn</h2><p>Mọi cập nhật đều có nguồn bằng chứng và chỉ hiển thị với nhà tuyển dụng khi bạn đạt PMT Ready.</p></article></aside></section>`;
      const lastAttempt=state.courseAttempts[state.activeCourse]||Object.values(state.courseAttempts).at(-1);
      const assessmentTab=`<section class="tp-tab-layout"><div class="tp-tab-main"><article class="card tp-tab-card"><div class="tp-card-heading"><div><h2>Bài đánh giá của bạn</h2><p>Kết quả demo được dùng để cập nhật tiến độ học tập.</p></div><span class="tp-status current">${Object.keys(state.courseAttempts).length+1} đã làm</span></div>
        <div class="tp-assessment"><div class="tp-assessment-head"><span class="tp-assessment-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></span><div class="tp-assessment-copy"><h3>Đánh giá đầu vào</h3><p>Xác định điểm khởi đầu và cá nhân hóa lộ trình PMT.</p></div><span class="tp-status done">Hoàn thành</span></div><div class="tp-assessment-result"><div><strong>Baseline</strong>Cấp độ</div><div><strong>6 năng lực</strong>Đã phân tích</div><div><strong>12/05/2025</strong>Ngày làm</div></div></div>
        ${lastAttempt?`<div class="tp-assessment"><div class="tp-assessment-head"><span class="tp-assessment-icon"><i class="fa-regular fa-star"></i></span><div class="tp-assessment-copy"><h3>Case · ${courseData(state.activeCourse).module}</h3><p>Kết quả mô phỏng cục bộ, không gọi AI Agent.</p></div><span class="tp-status ${lastAttempt.result==="pass"?"done":"waiting"}">${lastAttempt.result==="pass"?"Đạt":"Chưa đạt"} ${lastAttempt.evaluation.score}/5</span></div><div class="tp-assessment-result"><div><strong>${lastAttempt.evaluation.score}/5★</strong>Điểm demo</div><div><strong>${courseData(state.activeCourse).competency}</strong>Năng lực</div><div><strong>Vừa xong</strong>Ngày làm</div></div></div>`:""}
        <div class="tp-assessment"><div class="tp-assessment-head"><span class="tp-assessment-icon"><i class="fa-solid fa-clipboard-list"></i></span><div class="tp-assessment-copy"><h3>Execution Assessment</h3><p>Đánh giá khả năng ưu tiên, triển khai và theo sát kết quả.</p></div><span class="tp-status waiting">Đề xuất tiếp theo</span></div><div style="margin:14px 0 0 53px"><button class="btn btn-primary btn-sm" onclick="notify('Bài đánh giá sẽ mở sau khi hoàn thành System Thinking.')">Xem điều kiện mở <i class="fa-solid fa-arrow-right"></i></button></div></div>
      </article></div><aside class="tp-tab-side"><article class="card tp-tab-card"><div class="tp-card-heading"><div><h2>Tác động đến hồ sơ</h2><p>Tiến độ đã được đồng bộ.</p></div></div><div class="tp-score-impact"><i class="fa-solid fa-arrow-trend-up"></i><div><b>Readiness</b><span>Từ các khóa đã hoàn thành</span></div><b>${score}/100</b></div><div class="tp-score-impact"><i class="fa-solid fa-check"></i><div><b>Rubric xác minh</b><span>Đủ bằng chứng</span></div><b>${state.criteriaCompleted}</b></div><div class="tp-score-impact"><i class="fa-solid fa-star"></i><div><b>Điểm rubric</b><span>Đã cộng vào hồ sơ</span></div><b>${state.points}đ</b></div></article><article class="tp-focus"><span class="tp-status current">Demo local</span><h2 style="margin-top:12px">Hai biến thể kết quả</h2><p>Mỗi lần nộp bài tạo ngẫu nhiên kết quả 3★ hoặc 4★. Chỉ 4★ mở course tiếp theo.</p><button class="btn btn-outline btn-sm" onclick="${lastAttempt?"route('result')":"startLearning()"}">${lastAttempt?"Xem kết quả gần nhất":"Bắt đầu học"}</button></article></aside></section>`;
      const tabContent={overview,competency:competencyTab,rubric:rubricTab,history:historyTab,assessment:assessmentTab};
      return shell(`${profileHeader}${tabContent[state.profileTab]}`,"profile-portal","AI Talent");
    }

    function ready(){
      if(!isReady()){notify("Hoàn thành 4 khóa học và 13 tiêu chí để mở PMT Ready.");return learning();}
      if(state.applicationStatus==="submitted") return submittedHome();
      const fullName=escapeHtml(studentFullName());
      const shortName=escapeHtml(studentShortName());
      const initial=escapeHtml(studentInitial());
      const verificationCode=escapeHtml(studentVerificationCode());
      const competencies=competencyScores();
      const opportunities=[
        ["fa-solid fa-rocket","Product Management Trainee 2027 · Zalo","Hồ sơ của bạn đã đủ điều kiện gửi thẳng cho đội Tuyển dụng","Ứng tuyển ngay","btn-orange","applyPmt()"],
        ["fa-solid fa-briefcase","Product Internship Program · Zalo","Kỳ thực tập 6 tháng, có mentor 1:1","Xem chi tiết","btn-outline","notify('Chi tiết chương trình Internship sẽ mở trong phiên bản tiếp theo.')"],
        ["fa-solid fa-globe","Join PM Community","Kết nối với mentor và các bạn cùng lộ trình","Tham gia","btn-outline","notify('PM Community sẽ mở trong phiên bản tiếp theo.')"],
        ["fa-solid fa-microphone","Book mock interview","Luyện với PM thật (không phải phỏng vấn thật)","Đặt lịch","btn-outline","notify('Lịch mock interview sẽ mở trong phiên bản tiếp theo.')"]
      ];
      const body=`<header class="ready-top"><div><h1>Chào ${shortName}</h1><p>Đây là tổng quan học tập và sự nghiệp của bạn.</p></div><div class="sh-top-actions"><button class="sh-round-action" onclick="notify('Bạn có 3 cập nhật mới.')"><i class="fa-regular fa-bell"></i><span class="sh-notice">3</span></button><span class="sh-user">${initial}</span></div></header>
      <section class="pmt-hero">
        <div class="pmt-hero-copy"><div class="pmt-kicker">Chúc mừng!</div><h2>Bạn đã đạt PMT Ready</h2><p>Bạn đã hoàn thành tất cả năng lực bắt buộc và đạt tiêu chí sẵn sàng PMT của Zalo.</p><span class="pmt-verified"><i class="fa-solid fa-circle-check"></i>Verified by Zalo Talent Competency Engine</span><div class="pmt-hero-actions"><button class="btn btn-orange" onclick="applyPmt()"><i class="fa-solid fa-rocket"></i>Ứng tuyển PMT Program</button><button class="btn btn-outline" onclick="route('profile')">Xem Talent Profile <i class="fa-solid fa-arrow-right"></i></button></div></div>
        <div class="pmt-badge"><span class="pmt-badge-icon"><i class="fa-solid fa-award"></i></span><b>PMT Ready</b><span>Verified by Zalo Talent</span></div>
      </section>
      <section class="pmt-overview">
        <article class="card pmt-summary"><div class="pmt-score-ring"><div class="pmt-score-inner"><strong>100</strong><span>/100</span><b>PMT READY</b></div></div><h2>Readiness summary</h2>${[["13/13 năng lực"],["65/65 điểm rubric"],["4/4 khóa học"],["Đã hoàn thành đánh giá cuối"]].map(([label])=>`<div class="pmt-check-row"><i class="fa-solid fa-circle-check"></i><span>${label}</span></div>`).join("")}<div class="pmt-complete-pill"><i class="fa-solid fa-check"></i>Hoàn thành toàn bộ yêu cầu</div></article>
        <article class="card pmt-competencies"><div class="pmt-card-heading"><h2>Verified competencies</h2><button class="pmt-link" onclick="state.profileTab='competency';route('profile')">Xem tất cả <i class="fa-solid fa-arrow-right"></i></button></div><div class="pmt-competency-grid">${competencies.map(competency=>`<div class="pmt-competency"><span class="pmt-competency-icon"><i class="${competency.icon}"></i></span><div><b>${competency.name}</b><span class="pmt-stars">${Array.from({length:5},(_,index)=>`<i class="${index<competency.stars?"fa-solid":"fa-regular"} fa-star"></i>`).join("")}</span><small>${competency.percent}% · Đã xác minh</small></div></div>`).join("")}</div></article>
      </section>
      <section class="card pmt-certificate"><div class="pmt-certificate-intro"><i class="fa-solid fa-certificate"></i><h2>Chứng nhận PMT Ready</h2><span>Đủ điều kiện</span></div><p>Tạo chứng nhận có mã xác thực để chia sẻ với nhà tuyển dụng hoặc đính kèm vào CV.</p><div class="pmt-certificate-grid">
        <article class="certificate-preview"><div class="certificate-preview-top"><span>Chứng nhận hoàn thành</span><span class="certificate-seal"><i class="fa-solid fa-award"></i></span></div><div class="certificate-name">${fullName}</div><div class="certificate-role">Product Management Trainee — <b>PMT Ready</b></div><div class="certificate-metrics"><div><strong>13/13</strong><span>năng lực</span></div><div><strong>65/65</strong><span>điểm rubric</span></div><div><strong>25/07/2026</strong><span>ngày cấp</span></div></div><div class="certificate-code"><div><span>Mã xác thực</span><b>${verificationCode}</b></div><div class="certificate-powered">Powered by<b>Zalo</b></div></div></article>
        <div class="certificate-benefits"><div class="certificate-benefits-title">Chứng nhận gồm</div>${["Mã xác thực tra cứu được trên Zalo Talent","13 năng lực kèm mức rubric đã đạt","Bản PDF in được và link chia sẻ công khai"].map(item=>`<div class="certificate-benefit"><i class="fa-solid fa-check"></i><span>${item}</span></div>`).join("")}<div class="certificate-actions"><button class="btn btn-orange" onclick="createCertificate()"><i class="fa-solid ${state.certificate?"fa-check":"fa-certificate"}"></i>${state.certificate?"Đã tạo chứng nhận":"Tạo chứng nhận"}</button><div class="certificate-secondary"><button class="btn btn-outline" onclick="downloadCertificate()"><i class="fa-solid fa-download"></i>Tải PDF</button><button class="btn btn-outline" onclick="shareCertificate()"><i class="fa-solid fa-link"></i>Chia sẻ link</button></div></div></div>
      </div></section>
      <section class="card pmt-opportunities"><h2>Cơ hội dành cho bạn</h2>${opportunities.map(([icon,title,copy,action,kind,handler])=>`<div class="opportunity-row"><span class="opportunity-icon"><i class="${icon}"></i></span><div class="opportunity-copy"><b>${title}</b><span>${copy}</span></div><button class="btn ${kind}" onclick="${handler}">${action} <i class="fa-solid fa-arrow-right"></i></button></div>`).join("")}</section>`;
      return shell(body,"ready-portal","AI Talent");
    }

    function createCertificate(){
      if(!state.certificate){state.certificate=true;render();notify("Chứng chỉ PMT Ready đã được tạo.");}
      else notify("Chứng chỉ PMT Ready đã sẵn sàng.");
    }

    function downloadCertificate(){
      if(!state.certificate){state.certificate=true;render();}
      notify("Bản PDF chứng nhận đang được chuẩn bị.");
    }

    function shareCertificate(){
      const slug=studentFullName().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
        .replace(/Đ/g,"D").replace(/đ/g,"d").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
      if(navigator.clipboard) navigator.clipboard.writeText(`${location.origin||""}${location.pathname||""}?certificate=${encodeURIComponent(slug)}`);
      notify("Đã sao chép link chứng chỉ.");
    }

    function applyPmt(){
      state.applicationStatus="submitted";
      route("home");
      notify("Hồ sơ PMT đã được gửi thành công.");
    }

    function render(){
      let html;
      if(state.view==="login") html=login();
      else if(state.view==="onboarding") html=onboarding();
      else if(state.view==="home") html=home();
      else if(state.view==="learning") html=learning();
      else if(state.view==="course") html=course();
      else if(state.view==="result") html=result();
      else if(state.view==="profile") html=profile();
      else if(state.view==="ready") html=ready();
      else if(["assessment","community"].includes(state.view)){state.view="home";html=home();}
      app.innerHTML=html;
      persistStudentState();
    }

    if(typeof window.addEventListener==="function") window.addEventListener("pagehide",persistStudentState);
    render();
  </script>
</body>
</html>
