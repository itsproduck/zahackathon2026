<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#005654">
    <title>AI Talent Platform — TA Portal</title>
    <link rel="stylesheet" href="./typography.css">
    <link rel="stylesheet" href="./iconography.css">
    <style>
      :root {
        --teal: #2fa1b3;
        --teal-deep: #005654;
        --teal-dark: #073f3e;
        --teal-wash: #e4f2f3;
        --teal-soft: #f1f8f8;
        --orange: #f05b2f;
        --orange-dark: #d94d25;
        --orange-wash: #fde7df;
        --ink: #172226;
        --body: #46565b;
        --muted: #718084;
        --line: #e2eaea;
        --line-strong: #cfdddd;
        --page: #f5f8f8;
        --white: #fff;
        --green: #16876e;
        --green-wash: #e4f5ef;
        --gold: #a96d12;
        --gold-wash: #fff4dc;
        --red: #bd4b4b;
        --red-wash: #fbeaea;
        --violet: #7052a0;
        --violet-wash: #eee8f8;
        --shadow: 0 12px 32px rgba(0, 86, 84, .07);
        --shadow-lg: 0 24px 60px rgba(6, 55, 54, .18);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--page);
        font-family: var(--font-sans);
        font-size: var(--type-body-size);
        line-height: var(--type-body-line);
      }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
        outline: 3px solid rgba(47, 161, 179, .24);
        outline-offset: 2px;
      }
      a { color: inherit; }
      .hidden { display: none !important; }
      .shell { min-height: 100vh; display: grid; grid-template-columns: 248px minmax(0, 1fr); }

      /* Sidebar */
      aside {
        position: sticky;
        top: 0;
        height: 100vh;
        min-height: 650px;
        padding: 22px 15px 18px;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--line);
        background: var(--white);
        z-index: 10;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 1px 8px 22px;
        border-bottom: 1px solid var(--line);
      }
      .brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        color: var(--white);
        background: var(--teal);
        font-size: 17px;
        font-weight: var(--weight-semibold);
        box-shadow: 0 7px 16px rgba(47, 161, 179, .24);
      }
      .brand strong { display: block; font-size: 14px; line-height: 1.35; font-weight: var(--weight-semibold); letter-spacing: -.02em; }
      .brand small { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; letter-spacing: .09em; text-transform: uppercase; }
      nav { padding-top: 20px; }
      .nav-label {
        padding: 0 11px 8px;
        color: #8c989b;
        font-size: 10px;
        line-height: 1.4;
        font-weight: var(--weight-semibold);
        letter-spacing: .11em;
        text-transform: uppercase;
      }
      .nav-label.admin { margin-top: 23px; }
      .nav-item {
        width: 100%;
        margin: 2px 0;
        padding: 10px 11px;
        display: flex;
        align-items: center;
        gap: 10px;
        border: 0;
        border-radius: 9px;
        color: #4d5d61;
        background: transparent;
        text-align: left;
        font-size: 13px;
        transition: background .16s ease, color .16s ease;
      }
      .nav-item:hover { color: var(--teal-deep); background: #f3f7f7; }
      .nav-item.active { color: var(--teal-deep); background: var(--teal-wash); font-weight: var(--weight-semibold); }
      .nav-icon {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        color: #738286;
        background: #f1f4f4;
        font-size: 12px;
      }
      .nav-item.active .nav-icon { color: var(--white); background: var(--teal); }
      .nav-count {
        min-width: 23px;
        margin-left: auto;
        padding: 2px 6px;
        border-radius: 99px;
        color: var(--white);
        background: var(--orange);
        text-align: center;
        font-size: 10px;
        line-height: 1.5;
      }
      .sidebar-note {
        margin-top: auto;
        padding: 14px;
        border: 1px solid #dcecec;
        border-radius: 11px;
        background: var(--teal-soft);
      }
      .sidebar-note-head { display: flex; align-items: center; gap: 8px; color: var(--teal-deep); font-size: 11px; font-weight: var(--weight-semibold); }
      .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(22, 135, 110, .12); }
      .sidebar-note p { margin: 7px 0 0; color: var(--muted); font-size: 10px; line-height: 1.55; }
      .sidebar-foot { padding: 17px 7px 0; }
      .profile { display: flex; align-items: center; gap: 10px; }
      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: inline-grid;
        place-items: center;
        flex: none;
        color: var(--teal-deep);
        background: #d6edef;
        font-size: 11px;
        font-weight: var(--weight-semibold);
      }
      .profile strong { display: block; font-size: 12px; line-height: 1.4; font-weight: var(--weight-semibold); }
      .profile small { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }

      /* Layout */
      main { min-width: 0; padding: 0 34px 50px; }
      .topbar {
        height: 72px;
        margin: 0 -34px 0;
        padding: 0 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        border-bottom: 1px solid rgba(226, 234, 234, .85);
        background: rgba(245, 248, 248, .9);
        backdrop-filter: blur(12px);
        position: sticky;
        top: 0;
        z-index: 8;
      }
      .crumb { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
      .crumb b { color: var(--teal-deep); font-weight: var(--weight-medium); }
      .top-actions { display: flex; align-items: center; gap: 9px; }
      .student-link {
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 99px;
        color: var(--teal-deep);
        background: var(--white);
        text-decoration: none;
        font-size: 11px;
        font-weight: var(--weight-medium);
      }
      .student-link:hover { border-color: var(--teal); background: var(--teal-wash); }
      .top-icon {
        width: 36px;
        height: 36px;
        padding: 0;
        display: inline-grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 50%;
        color: var(--teal-deep);
        background: var(--white);
        line-height: 1;
        text-align: center;
        position: relative;
      }
      .top-icon.has-notice::after {
        content: "";
        position: absolute;
        top: 7px;
        right: 7px;
        width: 6px;
        height: 6px;
        border: 2px solid var(--white);
        border-radius: 50%;
        background: var(--orange);
      }
      .view { padding-top: 31px; animation: enter .24s ease; }
      @keyframes enter { from { opacity: .25; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
      .page-heading {
        margin-bottom: 23px;
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: flex-end;
      }
      .eyebrow {
        margin: 0 0 7px;
        color: var(--teal);
        font-size: 10px;
        line-height: 1.4;
        font-weight: var(--weight-semibold);
        letter-spacing: .11em;
        text-transform: uppercase;
      }
      h1 { margin: 0; color: var(--teal-deep); font-size: 28px; line-height: 1.28; font-weight: var(--weight-medium); letter-spacing: -.035em; }
      .subtitle { max-width: 680px; margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.65; font-weight: var(--weight-light); }
      .date-chip { padding: 8px 12px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); background: var(--white); white-space: nowrap; font-size: 10px; }
      .page-actions { display: flex; align-items: center; gap: 8px; }

      /* Shared components */
      .card { border: 1px solid var(--line); border-radius: 13px; background: var(--white); box-shadow: var(--shadow); overflow: hidden; }
      .card-head {
        min-height: 65px;
        padding: 16px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        border-bottom: 1px solid var(--line);
      }
      .card-head h2 { margin: 0; color: var(--teal-deep); font-size: 15px; line-height: 1.4; font-weight: var(--weight-medium); }
      .card-head p { margin: 3px 0 0; color: var(--muted); font-size: 10px; line-height: 1.5; }
      .card-body { padding: 18px; }
      .label {
        color: var(--muted);
        font-size: 10px;
        line-height: 1.4;
        font-weight: var(--weight-semibold);
        letter-spacing: .095em;
        text-transform: uppercase;
      }
      .btn {
        min-height: 36px;
        padding: 8px 13px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border-radius: 8px;
        border: 1px solid transparent;
        font-size: 11px;
        line-height: 1.3;
        font-weight: var(--weight-semibold);
        transition: .16s ease;
      }
      .btn-primary { color: var(--white); background: var(--orange); border-color: var(--orange); }
      .btn-primary:hover { background: var(--orange-dark); border-color: var(--orange-dark); }
      .btn:disabled { cursor: not-allowed; opacity: .52; }
      .btn-secondary { color: var(--teal-deep); background: var(--white); border-color: var(--teal); }
      .btn-secondary:hover { background: var(--teal-wash); }
      .btn-quiet { color: var(--teal-deep); background: transparent; border-color: var(--line); }
      .btn-quiet:hover { border-color: var(--teal); background: var(--teal-soft); }
      .btn-link { min-height: auto; padding: 4px; border: 0; color: var(--teal); background: transparent; font-size: 10px; font-weight: var(--weight-semibold); }
      .btn-danger { color: var(--red); border-color: #eccfcf; background: var(--white); }
      .icon-button { width: 32px; height: 32px; padding: 0; display: inline-grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; color: var(--teal-deep); background: var(--white); line-height: 1; text-align: center; }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 8px;
        border-radius: 99px;
        color: var(--teal-deep);
        background: var(--teal-wash);
        font-size: 9px;
        line-height: 1.45;
        font-weight: var(--weight-medium);
        white-space: nowrap;
      }
      .pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .85; }
      .pill.green { color: var(--green); background: var(--green-wash); }
      .pill.gold { color: var(--gold); background: var(--gold-wash); }
      .pill.orange { color: #bd4b28; background: var(--orange-wash); }
      .pill.red { color: var(--red); background: var(--red-wash); }
      .pill.violet { color: var(--violet); background: var(--violet-wash); }
      .select, .input {
        min-height: 37px;
        padding: 8px 10px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        color: var(--body);
        background: var(--white);
        outline: none;
        font-size: 11px;
      }
      .input:focus, .select:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(47, 161, 179, .12); }
      .search-wrap { position: relative; flex: 1; min-width: 210px; }
      .search-wrap .input { width: 100%; padding-left: 34px; }
      .search-wrap > span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #91a0a3; font-size: 13px; }
      .toggle { width: 38px; height: 22px; padding: 2px; border: 0; border-radius: 99px; background: #c9d3d4; transition: .2s ease; }
      .toggle span { display: block; width: 18px; height: 18px; border-radius: 50%; background: var(--white); box-shadow: 0 2px 5px rgba(0,0,0,.16); transition: .2s ease; }
      .toggle.on { background: var(--green); }
      .toggle.on span { transform: translateX(16px); }
      .empty { padding: 46px 20px; color: var(--muted); text-align: center; font-size: 12px; }

      /* Overview */
      .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(145px, 1fr)); gap: 13px; margin-bottom: 18px; }
      .metric { min-height: 116px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--white); }
      .metric-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 10px; }
      .metric-icon { width: 27px; height: 27px; border-radius: 8px; display: grid; place-items: center; color: var(--teal-deep); background: var(--teal-wash); font-size: 11px; }
      .metric.orange .metric-icon { color: #b94625; background: var(--orange-wash); }
      .metric.gold .metric-icon { color: var(--gold); background: var(--gold-wash); }
      .metric.green .metric-icon { color: var(--green); background: var(--green-wash); }
      .metric strong { display: block; margin-top: 12px; font-size: 25px; line-height: 1; font-weight: var(--weight-semibold); letter-spacing: -.045em; }
      .metric small { display: block; margin-top: 6px; color: var(--muted); font-size: 9px; line-height: 1.45; }
      .overview-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, .82fr); gap: 17px; }
      .overview-stack { display: grid; gap: 17px; align-content: start; }
      .program-list { padding: 4px 17px 13px; }
      .program-row {
        width: 100%;
        padding: 14px 2px;
        display: grid;
        grid-template-columns: minmax(185px, 1.1fr) minmax(270px, 1.65fr) 92px 18px;
        gap: 15px;
        align-items: center;
        border: 0;
        border-bottom: 1px solid var(--line);
        color: inherit;
        background: transparent;
        text-align: left;
      }
      .program-row:last-child { border-bottom: 0; }
      .program-row:hover { background: linear-gradient(90deg, transparent, #f8fbfb 8%, #f8fbfb 92%, transparent); }
      .program-name strong { display: block; font-size: 12px; line-height: 1.45; font-weight: var(--weight-semibold); }
      .program-name span { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }
      .mini-funnel { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
      .funnel-step { min-width: 0; }
      .funnel-step i { display: block; height: 5px; margin-bottom: 6px; border-radius: 99px; background: var(--teal); opacity: var(--step-opacity, 1); }
      .funnel-step.ownership-support i { background: var(--violet); }
      .funnel-step.ownership-approve i { background: var(--orange); }
      .funnel-step b { display: block; color: var(--body); font-size: 9px; line-height: 1.25; }
      .funnel-step span { display: block; color: var(--muted); font-size: 8px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .health { text-align: right; }
      .health strong { display: block; color: var(--teal-deep); font-size: 11px; }
      .health span { color: var(--muted); font-size: 8px; }
      .action-list { padding: 5px 18px 12px; }
      .action-item { padding: 13px 0; display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: start; border-bottom: 1px solid var(--line); }
      .action-item:last-child { border: 0; }
      .action-number { width: 27px; height: 27px; border-radius: 8px; display: grid; place-items: center; color: #b64524; background: var(--orange-wash); font-size: 10px; font-weight: var(--weight-semibold); }
      .action-item:nth-child(2) .action-number { color: var(--gold); background: var(--gold-wash); }
      .action-item:nth-child(3) .action-number { color: var(--teal-deep); background: var(--teal-wash); }
      .action-copy b { display: block; color: var(--body); font-size: 11px; line-height: 1.45; font-weight: var(--weight-medium); }
      .action-copy span { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; line-height: 1.45; }
      .trend-card { grid-column: 1 / -1; }
      .trend-toolbar { display: flex; gap: 5px; }
      .trend-tab { padding: 5px 8px; border: 0; border-radius: 6px; color: var(--muted); background: transparent; font-size: 9px; }
      .trend-tab.active { color: var(--teal-deep); background: var(--teal-wash); font-weight: var(--weight-semibold); }
      .chart-wrap { padding: 16px 20px 14px; }
      .chart-summary { margin-bottom: 10px; display: flex; align-items: baseline; gap: 8px; }
      .chart-summary strong { color: var(--teal-deep); font-size: 20px; line-height: 1; }
      .chart-summary span { color: var(--green); font-size: 9px; }
      .chart { width: 100%; height: 142px; display: block; overflow: visible; }
      .chart-grid line { stroke: #e8eeee; stroke-width: 1; }
      .chart-area { fill: url(#areaFill); }
      .chart-line { fill: none; stroke: var(--teal); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .chart-point { fill: var(--white); stroke: var(--teal); stroke-width: 2; }
      .chart-labels-row { margin-top: 4px; display: grid; grid-template-columns: repeat(7, 1fr); color: #91a0a3; font-size: 8px; text-align: center; }

      /* Pipeline */
      .filter-bar {
        margin-bottom: 13px;
        padding: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--white);
      }
      .ownership-guide {
        margin-bottom: 13px;
        padding: 9px 12px;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 7px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--muted);
        background: var(--white);
        font-size: 8px;
      }
      .ownership-guide > strong { color: var(--body); font-size: 9px; font-weight: var(--weight-semibold); }
      .ownership-guide span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
      .ownership-guide i, .ownership-badge i { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--teal); }
      .ownership-guide .ownership-support i, .ownership-badge.ownership-support i { background: var(--violet); }
      .ownership-guide .ownership-approve i, .ownership-badge.ownership-approve i { background: var(--orange); }
      .ownership-guide small { color: #8a989b; font-size: inherit; }
      .result-count { margin-left: auto; padding: 0 6px; color: var(--muted); font-size: 10px; white-space: nowrap; }
      .pipeline-card { overflow-x: auto; }
      .pipeline-table { min-width: 840px; }
      .pagination {
        margin-top: 13px;
        padding: 10px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--muted);
        background: var(--white);
        font-size: 9px;
      }
      .pagination-controls { display: flex; align-items: center; gap: 5px; }
      .page-button {
        min-width: 30px;
        height: 30px;
        padding: 0 9px;
        display: inline-grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--teal-deep);
        background: var(--white);
        font-size: 9px;
        font-weight: var(--weight-semibold);
      }
      .page-button:hover:not(:disabled), .page-button.active { border-color: var(--teal); background: var(--teal-wash); }
      .page-button:disabled { cursor: not-allowed; opacity: .45; }
      .pipeline-head, .candidate-row {
        display: grid;
        grid-template-columns: minmax(265px, 1.08fr) minmax(185px, .72fr) minmax(360px, 1.45fr);
        column-gap: 0;
      }
      .pipeline-head { color: var(--muted); background: #fafcfc; border-bottom: 1px solid var(--line); font-size: 9px; font-weight: var(--weight-semibold); letter-spacing: .085em; text-transform: uppercase; }
      .pipeline-head > div { padding: 11px 17px; }
      .candidate-row {
        width: 100%;
        padding: 0;
        border: 0;
        border-bottom: 1px solid var(--line);
        color: inherit;
        background: var(--white);
        text-align: left;
        transition: background .16s;
      }
      .candidate-row:last-child { border-bottom: 0; }
      .candidate-row:hover { background: #f7fbfb; }
      .candidate-row > div { min-width: 0; padding: 16px 17px; }
      .candidate-row > div + div { border-left: 1px solid #eef2f2; }
      .candidate-info { display: grid; grid-template-columns: 40px 1fr; gap: 11px; align-items: center; }
      .candidate-info .avatar { width: 40px; height: 40px; background: var(--avatar-bg, #dff0e9); color: var(--avatar-ink, var(--green)); }
      .candidate-info strong { display: block; font-size: 12px; line-height: 1.4; font-weight: var(--weight-semibold); }
      .candidate-info small { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; line-height: 1.5; }
      .candidate-tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; }
      .candidate-tags span { padding: 2px 6px; border-radius: 4px; color: #66767a; background: #f0f4f4; font-size: 8px; }
      .ai-score { display: flex; align-items: center; gap: 11px; }
      .score-ring {
        --score: 86;
        width: 47px;
        height: 47px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: conic-gradient(var(--score-color, var(--teal)) calc(var(--score) * 1%), #e8eeee 0);
        position: relative;
      }
      .score-ring::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--white); }
      .candidate-row:hover .score-ring::before { background: #f7fbfb; }
      .score-ring b { position: relative; color: var(--teal-deep); font-size: 11px; line-height: 1; }
      .score-copy strong { display: block; font-size: 10px; line-height: 1.4; }

      .ownership-badge { margin-top: 6px; display: inline-flex; align-items: center; gap: 5px; color: var(--teal-deep); font-size: 8px; font-weight: var(--weight-semibold); }

      .ai-summary { display: grid; grid-template-columns: 1fr 135px; gap: 14px; align-items: center; }

      /* Candidate detail */

      .detail-avatar { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; color: var(--avatar-ink, var(--green)); background: var(--avatar-bg, #dff0e9); font-size: 14px; font-weight: var(--weight-semibold); }
      .detail-title h1 { font-size: 24px; }

      .candidate-workspace { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(295px, .75fr); gap: 17px; align-items: start; }
      .detail-stack { display: grid; gap: 17px; }
      .summary-lead { margin: 0; color: #33464a; font-size: 13px; line-height: 1.75; font-weight: var(--weight-light); }
      .source-row { margin-top: 15px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }

      .source-card:nth-child(3) .source-icon { color: #b94625; background: var(--orange-wash); }

      .source-card p { margin: 3px 0 0; color: var(--muted); font-size: 8px; line-height: 1.45; }
      .score-layout { padding: 18px; display: grid; grid-template-columns: 118px 1fr; gap: 23px; align-items: center; }
      .large-score {
        --score: 86;

        height: 108px;

      .large-score strong { display: block; color: var(--teal-deep); font-size: 25px; line-height: 1; letter-spacing: -.05em; }

      .competencies { display: grid; gap: 10px; }

      .track { height: 6px; border-radius: 99px; overflow: hidden; background: #e8eeee; }

      .evidence-gap {

      .evidence-gap strong { color: #76551c; font-size: 11px; font-weight: var(--weight-medium); }
      .evidence-gap p { margin: 4px 0 0; color: #7f704f; font-size: 9px; line-height: 1.55; }
      .question-list { margin: 11px 0 0; padding: 0; list-style: none; counter-reset: questions; }

      .detail-actions { margin-top: 12px; display: grid; gap: 8px; }

      .agent-box { margin-top: 11px; padding: 11px; border: 1px solid #d8eaea; border-radius: 9px; background: var(--teal-soft); }
      .agent-line { display: flex; gap: 9px; align-items: flex-start; }
      .agent-mark { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--white); background: var(--teal); font-size: 10px; font-weight: var(--weight-semibold); }
      .agent-line b { display: block; color: var(--teal-deep); font-size: 10px; }

      .agent-capabilities li::before { content: "✓"; position: absolute; left: 0; color: var(--green); font-weight: var(--weight-semibold); }
      .activity-list { padding: 3px 18px 12px; }

      .activity::before { content: ""; position: absolute; top: 16px; left: -4px; width: 7px; height: 7px; border: 2px solid var(--white); border-radius: 50%; background: var(--teal); }

      /* Agents */

      .agent-stats { margin-top: 14px; padding: 10px 0; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
      .agent-stat { padding: 0 10px; border-right: 1px solid var(--line); }
      .agent-stat:first-child { padding-left: 0; }
      .agent-stat:last-child { border: 0; }
      .agent-stat span { display: block; color: var(--muted); font-size: 8px; }

      .agent-card-foot { margin-top: 13px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .version { color: var(--muted); font-size: 8px; }

      /* Programs */
      .program-admin-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .program-card { border: 1px solid var(--line); border-radius: 12px; background: var(--white); overflow: hidden; }
      .program-card.off { opacity: .72; }
      .program-card-top { padding: 17px; display: grid; grid-template-columns: 42px 1fr auto; gap: 11px; align-items: center; border-bottom: 1px solid var(--line); }
      .program-logo { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; color: var(--white); background: var(--teal); font-size: 12px; font-weight: var(--weight-semibold); }
      .program-card:nth-child(2) .program-logo { background: var(--violet); }
      .program-card:nth-child(3) .program-logo { background: var(--orange); }
      .program-card:nth-child(4) .program-logo { background: #607d86; }
      .program-card h2 { margin: 0; color: var(--teal-deep); font-size: 13px; line-height: 1.4; font-weight: var(--weight-medium); }
      .program-card-top p { margin: 2px 0 0; color: var(--muted); font-size: 8px; }
      .program-card-body { padding: 15px 17px; }
      .program-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .program-meta div { padding: 8px; border-radius: 8px; background: #f6f9f9; }
      .program-meta span { display: block; color: var(--muted); font-size: 8px; }
      .program-meta b { display: block; margin-top: 2px; color: var(--body); font-size: 10px; }
      .program-progress { margin-top: 13px; }
      .program-progress-head { display: flex; justify-content: space-between; color: var(--muted); font-size: 8px; }
      .program-progress .track { margin-top: 6px; height: 7px; }
      .program-card-foot { padding: 11px 17px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); background: #fbfdfd; }
      .program-card-foot span { color: var(--muted); font-size: 8px; }

      /* AI Screening intake drawer */
      .screening-backdrop {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: flex-end;
        background: rgba(12, 33, 35, .42);
        backdrop-filter: blur(3px);
        z-index: 100;
        animation: fade .18s ease;
      }
      .screening-drawer {
        width: min(650px, 100%);

        background: var(--white);
        box-shadow: -18px 0 55px rgba(6, 55, 54, .18);
        animation: drawerIn .24s ease;
      }
      @keyframes drawerIn { from { transform: translateX(28px); opacity: .5; } to { transform: translateX(0); opacity: 1; } }
      .screening-head {
        padding: 22px 26px 18px;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        border-bottom: 1px solid var(--line);

      .screening-title { display: flex; align-items: center; gap: 9px; }

      .screening-spark { color: var(--orange); font-size: 16px; }
      .screening-head p { margin: 4px 0 0; color: var(--muted); font-size: 10px; line-height: 1.55; }

        font-weight: var(--weight-semibold);

      .screen-upload {
        margin-top: 12px;
        padding: 13px 15px;

        align-items: center;
        gap: 12px;

        background: var(--teal-wash);
        transition: background .16s ease, border-color .16s ease;
      }
      .screen-upload.empty { cursor: pointer; border-color: var(--line-strong); background: #fafcfc; }
      .screen-upload.empty:hover { border-color: var(--teal); background: var(--teal-soft); }
      .screen-upload.empty .screen-file-icon { color: var(--teal-deep); background: var(--teal-wash); }
      .screen-upload.dragging { border-color: var(--orange); background: var(--orange-wash); }
      .screen-file-icon {
        width: 37px;
        height: 43px;
        display: grid;
        place-items: center;
        flex: none;
        border-radius: 6px;
        color: var(--red);
        background: var(--white);
        font-size: 9px;
        font-weight: var(--weight-bold);
      }
      .screen-file-copy { min-width: 0; flex: 1; }
      .screen-file-copy strong { display: block; overflow: hidden; color: var(--ink); font-size: 11px; line-height: 1.4; text-overflow: ellipsis; white-space: nowrap; }
      .screen-file-copy span { display: block; margin-top: 2px; color: var(--muted); font-size: 8px; }
      .screen-file-check { width: 18px; height: 18px; display: grid; place-items: center; flex: none; border-radius: 50%; color: var(--white); background: var(--green); font-size: 9px; font-weight: var(--weight-bold); }
      .screen-or { margin: 12px 0; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 8px; }
      .screen-or::before, .screen-or::after { content: ""; height: 1px; flex: 1; background: var(--line); }
      .screen-source-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .screen-source {
        min-height: 38px;

        border-radius: 7px;

      }
      .screen-source:hover { border-color: var(--teal); background: var(--teal-soft); }
      .screen-role-wrap { margin-top: 12px; position: relative; }

      .screen-role-icon { position: absolute; top: 50%; left: 12px; color: var(--muted); transform: translateY(-50%); font-size: 11px; pointer-events: none; z-index: 1; }
      .screen-result { margin-top: 12px; overflow: hidden; border: 1px solid var(--line); border-radius: 9px; }
      .screen-agent-action { margin-top: 12px; }
      .screen-run-button { width: 100%; min-height: 43px; }
      .screen-agent-progress {
        min-height: 62px;
        padding: 12px 14px;
        display: flex;
        align-items: center;
        gap: 11px;
        border: 1px solid #d7e9e9;
        border-radius: 8px;
        background: var(--teal-soft);
      }
      .screen-agent-spinner {
        width: 26px;
        height: 26px;
        flex: none;
        border: 3px solid #cfe5e6;
        border-top-color: var(--teal);
        border-radius: 50%;
        animation: screenSpin .8s linear infinite;
      }
      @keyframes screenSpin { to { transform: rotate(360deg); } }
      .screen-agent-progress strong { display: block; color: var(--teal-deep); font-size: 10px; }
      .screen-agent-progress span { display: block; margin-top: 2px; color: var(--muted); font-size: 8px; line-height: 1.45; }
      .screen-result-top { padding: 18px; display: grid; grid-template-columns: 82px 1fr; gap: 17px; align-items: center; }
      .screen-score-ring {
        --score: 91;
        width: 76px;
        height: 76px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: conic-gradient(var(--green) calc(var(--score) * 1%), #e7eeee 0);
        position: relative;
      }
      .screen-score-ring::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--white); }
      .screen-score-ring > span { position: relative; text-align: center; }
      .screen-score-ring strong { display: block; color: var(--ink); font-size: 19px; line-height: 1; letter-spacing: -.035em; }
      .screen-score-ring small { display: block; margin-top: 3px; color: var(--muted); font-size: 7px; }
      .screen-match-label { display: inline-flex; padding: 4px 8px; border-radius: 99px; color: var(--green); background: var(--green-wash); font-size: 8px; font-weight: var(--weight-semibold); }
      .screen-result-copy h4 { margin: 7px 0 0; color: var(--ink); font-size: 15px; line-height: 1.35; font-weight: var(--weight-semibold); }
      .screen-result-copy p { margin: 4px 0 0; color: var(--muted); font-size: 9px; line-height: 1.5; }
      .screen-detail-link { margin-top: 7px; padding: 0; border: 0; color: var(--teal); background: transparent; font-size: 8px; font-weight: var(--weight-medium); }
      .screen-evidence-grid { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
      .screen-evidence { padding: 14px 16px; }
      .screen-evidence + .screen-evidence { border-left: 1px solid var(--line); }
      .screen-evidence h4 { margin: 0; color: var(--body); font-size: 10px; line-height: 1.4; font-weight: var(--weight-semibold); }
      .screen-evidence ul { margin: 9px 0 0; padding: 0; list-style: none; }
      .screen-evidence li { margin-top: 6px; padding-left: 14px; color: var(--body); font-size: 9px; line-height: 1.4; position: relative; }
      .screen-evidence.positive li::before { content: "✓"; position: absolute; left: 0; color: var(--green); font-weight: var(--weight-bold); }
      .screen-evidence.gaps li::before { content: "▲"; position: absolute; left: 0; color: var(--gold); font-size: 7px; top: 2px; }
      .screen-match-title { margin: 14px 0 0; color: var(--body); font-size: 10px; font-weight: var(--weight-semibold); }
      .screen-matches { margin-top: 8px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
      .screen-match {
        min-width: 0;
        min-height: 35px;
        padding: 7px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 5px;
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--body);
        background: var(--white);
        font-size: 8px;
      }
      .screen-match b { padding: 2px 5px; border-radius: 99px; background: #f0f4f4; font-size: 7px; }
      .screen-match.best { color: var(--green); border-color: rgba(22, 135, 110, .35); background: var(--green-wash); font-weight: var(--weight-semibold); }

      .screen-link-field { display: none; margin-top: 9px; }
      .screen-link-field.show { display: flex; gap: 7px; }
      .screen-link-field .input { flex: 1; min-width: 0; }
      .screening-drawer .btn:disabled { cursor: not-allowed; opacity: .48; }

      /* Modal */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        padding: 22px;
        display: grid;
        place-items: center;
        background: rgba(12, 33, 35, .48);
        backdrop-filter: blur(3px);
        z-index: 100;
        animation: fade .18s ease;
      }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      .modal {
        width: min(610px, 100%);
        max-height: calc(100vh - 44px);
        overflow: auto;
        border-radius: 15px;
        background: var(--white);
        box-shadow: var(--shadow-lg);
      }
      .modal.small { width: min(480px, 100%); }

      function renderTrend() {

        const splitAcrossWeek = (total, weights) => {
          const weightTotal = weights.reduce((sum, weight) => sum + weight, 0);
          const values = weights.map(weight => Math.floor(total * weight / weightTotal));
          let remaining = total - values.reduce((sum, value) => sum + value, 0);
          for (let index = 0; remaining > 0; index = (index + 1) % values.length) {
            values[index] += 1;
            remaining -= 1;
          }
          return values;
        };
        const series = {
          applications: { total: activeCandidates.length, change: "All active-program CVs", values: splitAcrossWeek(activeCandidates.length, [12, 15, 13, 17, 14, 16, 13]) },
          qualified: { total: totalAtOrBeyond("qualified"), change: "Reached qualification", values: splitAcrossWeek(totalAtOrBeyond("qualified"), [10, 15, 13, 18, 14, 17, 13]) },
          interviews: { total: totalAtOrBeyond("interview"), change: "Reached interview", values: splitAcrossWeek(totalAtOrBeyond("interview"), [10, 16, 13, 18, 11, 19, 13]) }
        };
        const data = series[state.trend];

        return `<div class="chart-wrap"><div class="chart-summary"><strong>${data.total}</strong><span>${data.change}</span></div><svg class="chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-label="${state.trend} trend"><defs><linearGradient id="areaFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#2fa1b3" stop-opacity=".23"/><stop offset="100%" stop-color="#2fa1b3" stop-opacity=".02"/></linearGradient></defs><g class="chart-grid"><line x1="0" y1="30" x2="${width}" y2="30"/><line x1="0" y1="72" x2="${width}" y2="72"/><line x1="0" y1="114" x2="${width}" y2="114"/></g><polygon class="chart-area" points="${area}"/><polyline class="chart-line" points="${line}"/>${points.map(point => `<circle class="chart-point" cx="${point[0]}" cy="${point[1]}" r="4"/>`).join("")}</svg><div class="chart-labels-row">${["22 Jul", "23 Jul", "24 Jul", "25 Jul", "26 Jul", "27 Jul", "Today"].map(label => `<span>${label}</span>`).join("")}</div></div>`;
