              <select class="select" id="stageFilter" aria-label="Filter by stage"><option value="all">All stages</option>${Object.entries(stageLabels).map(([value, label]) => `<option value="${value}" ${state.stage === value ? "selected" : ""}>${label}</option>`).join("")}</select>
              <select class="select" id="scoreFilter" aria-label="Filter by AI score"><option value="all">All AI scores</option><option value="high" ${state.score === "high" ? "selected" : ""}>85+ strong</option><option value="medium" ${state.score === "medium" ? "selected" : ""}>75–84 review</option><option value="low" ${state.score === "low" ? "selected" : ""}>Below 75</option></select>
              <span class="result-count">${filtered.length} candidates</span>
            </div>
            <article class="card pipeline-card">
              <div class="pipeline-table">
                <div class="pipeline-head"><div>Candidate information</div><div>Score by AI</div><div>Summary & suggested next step</div></div>
                <div id="pipelineRows">
                  ${pageCandidates.length ? pageCandidates.map(renderCandidateRow).join("") : '<div class="empty">No candidates match this filter. Try broadening your search.</div>'}
                </div>
              </div>
            </article>
            <div id="paginationRoot">${renderPagination(filtered.length)}</div>
          </section>`;
      }

      function renderCandidateRow(candidate) {
        const program = programById(candidate.program);
        const scoreColor = candidate.score >= 85 ? "var(--green)" : candidate.score >= 75 ? "var(--gold)" : "var(--red)";
        return `<button class="candidate-row" data-candidate="${candidate.id}">
          <div class="candidate-info">
            <span class="avatar" style="--avatar-bg:${candidate.color[0]};--avatar-ink:${candidate.color[1]}">${candidate.initials}</span>
            <span><strong>${candidate.name}</strong><small>${candidate.school}<br>${program.name} · Applied ${candidate.applied}</small><span class="candidate-tags">${candidate.tags.map(tag => `<span>${tag}</span>`).join("")}</span></span>
          </div>
          <div class="ai-score"><span class="score-ring" style="--score:${candidate.score};--score-color:${scoreColor}"><b>${candidate.score}</b></span><span class="score-copy"><strong>${candidate.confidence}</strong><small>Evidence coverage 92%</small>${statusPill(candidate.stage)}</span></div>
          <div class="ai-summary"><p>${candidate.summary}</p><span class="next-step"><span>Next suggested</span><b>${candidate.next} →</b></span></div>
        </button>`;
      }

      function renderCandidateDetail() {
        const candidate = candidateById(state.selectedCandidate) || candidates[0];
        const program = programById(candidate.program);
        document.querySelector("#crumb").textContent = "Candidate details";
        return `<section class="view">
          <button class="back-button" id="backToPipeline">← Back to ${state.lastView === "overview" ? "overview" : "talent pipeline"}</button>
          <div class="page-heading candidate-title-row">
            <div class="detail-identity"><span class="detail-avatar" style="--avatar-bg:${candidate.color[0]};--avatar-ink:${candidate.color[1]}">${candidate.initials}</span><span class="detail-title"><h1>${candidate.name}</h1><span class="detail-title-meta">${candidate.email}<span>·</span>${candidate.location}<span>·</span>${statusPill(candidate.stage)}</span></span></div>
            <div class="page-actions"><button class="btn btn-quiet" data-action="request-evidence">Request evidence</button>${candidate.next.startsWith("Interview scheduled") ? '<button class="btn btn-secondary" disabled>✓ Interview scheduled</button>' : candidate.stage === "new" ? '<button class="btn btn-secondary" disabled>AI qualification running</button>' : candidate.stage === "offer" ? '<button class="btn btn-primary" data-action="approve-offer">Approve offer</button>' : `<button class="btn btn-primary" data-action="${candidate.stage === "interview" ? "schedule" : "advance"}">${candidate.stage === "interview" ? "✦ Find best slot" : candidate.stage === "review" ? "Approve interview" : "Start TA review"}</button>`}</div>
          </div>

          <div class="candidate-workspace">
            <div class="detail-stack">
              <article class="card">
                <div class="card-head"><div><h2>AI candidate summary</h2><p>Synthesized from verified learning, assignment and CV evidence.</p></div><span class="pill green">${candidate.confidence}</span></div>
                <div class="card-body">
                  <p class="summary-lead">${candidate.summary}</p>
                  <div class="source-row">
                    ${candidate.sources.map(source => `<div class="source-card"><div class="source-top"><span class="source-icon">${source[2]}</span><span class="verified">✓ Verified</span></div><b>${source[0]}</b><p>${source[1]}</p></div>`).join("")}
                  </div>
                </div>
              </article>

              <article class="card">
                <div class="card-head"><div><h2>Readiness score & evidence</h2><p>Six competencies synchronized with the Student Portal evidence model.</p></div><button class="btn-link" data-action="score-details">Detailed score →</button></div>
                <div class="score-layout">
                  <div class="large-score" style="--score:${candidate.score}"><div><strong>${candidate.score}</strong><span>out of 100</span></div></div>
                  <div class="competencies">${detailedCandidateScores(candidate).map(skill => `<div class="competency"><span>${skill.name}</span><div class="track"><i style="width:${skill.score}%"></i></div><b>${skill.score}</b></div>`).join("")}</div>
                </div>
              </article>

              <article class="card">
                <div class="card-head"><div><h2>Evidence gap for interviewer</h2><p>Use the interview to validate what the current evidence cannot prove.</p></div><span class="pill gold">1 material gap</span></div>
                <div class="card-body">
                  <div class="evidence-gap"><span class="gap-icon">!</span><div><strong>${candidate.gap}</strong><p>${candidate.gapDetail}</p></div></div>
                  <p class="label" style="margin:17px 0 0">Agent-prepared interview probes</p>
                  <ol class="question-list">${candidate.questions.map(question => `<li>${question}</li>`).join("")}</ol>
                </div>
              </article>
            </div>

            <section class="card decision-card" aria-label="Candidate decision">
              <div class="card-head"><div><h2>Decision workspace</h2><p>AI recommends. TA owns the decision.</p></div>${ownershipBadge(candidate.stage)}</div>
              <div class="decision-score"><div><strong>${candidate.next}</strong><span>Suggested based on ${candidate.score}% readiness</span></div><span class="pill ${candidate.score >= 85 ? "green" : "gold"}">${candidate.score >= 85 ? "Strong signal" : "Review signal"}</span></div>
              <div class="decision-block">
                <h3>Next round</h3>
                <p>${candidate.next.startsWith("Interview scheduled") ? "The interviewer confirmed the AI-recommended slot. Invitations and the evidence brief were sent automatically." : candidate.stage === "new" ? "The Qualification Agent is processing this CV end to end. TA will only be asked to act when accountable judgment is needed." : candidate.stage === "interview" ? "The Scheduling Agent will scan interviewer calendars for the next seven days and recommend the best-fit slot." : candidate.stage === "offer" ? "AI has consolidated the evidence and recommendation. A human hiring owner must approve before any offer is released." : "AI has prepared the evidence and recommendation; TA approval is required before the candidate moves forward."}</p>
                <div class="detail-actions">
                  ${candidate.next.startsWith("Interview scheduled") ? '<button class="btn btn-secondary" disabled>✓ Invitations sent</button>' : candidate.stage === "new" ? '<button class="btn btn-secondary" disabled>AI qualification running</button>' : candidate.stage === "offer" ? '<button class="btn btn-primary" data-action="approve-offer">Approve offer decision</button>' : `<button class="btn btn-primary" data-action="${candidate.stage === "interview" ? "schedule" : "advance"}">${candidate.stage === "interview" ? "✦ Let agent find the best slot" : candidate.stage === "review" ? "Approve interview" : "Start TA review"}</button>`}
                  <button class="btn btn-quiet" data-action="request-evidence">Request more evidence</button>
                </div>
              </div>
              <div class="decision-block">
                <h3>Interview Copilot</h3>
                <p>Bring the evidence record into the conversation without replacing interviewer judgment.</p>
                <div class="agent-box">
                  <div class="agent-line"><span class="agent-mark">AI</span><span><b>Ready to join</b><span>Consent notice and panel briefing included</span></span></div>
                  <ul class="agent-capabilities"><li>Live structured notes</li><li>Evidence-gap coverage</li><li>Draft pre-score after interview</li></ul>
                  <button class="btn btn-secondary" style="width:100%;margin-top:11px" data-action="copilot">Open interview copilot</button>
                </div>
              </div>
              <div class="decision-block">
                <h3>Recent activity</h3>
                <div class="activity-list" style="padding-left:0;padding-right:0">${candidate.timeline.map(event => `<div class="activity"><b>${event[0]}</b><span>${event[1]}</span></div>`).join("")}</div>
              </div>
            </section>
          </div>
        </section>`;
      }

      function renderAgents() {
        return `<section class="view">
          ${header("Admin zone · AI Agent Admin", "Manage the agents behind every decision.", "Monitor agent health, control availability and tune the policies used across your recruiting workflows.", '<div class="page-actions"><button class="btn btn-secondary" id="viewAgentLogs">View audit log</button><button class="btn btn-primary" id="addAgent">+ Add agent</button></div>')}
          <div class="agent-summary"><div class="summary-chip"><span>Active agents</span><strong>${agents.filter(agent => agent.active).length}/${agents.length}</strong></div><div class="summary-chip"><span>Runs this week</span><strong>5,796</strong></div><div class="summary-chip"><span>Average quality</span><strong>94.2%</strong></div></div>
          <div class="agent-grid">
            ${agents.map(agent => `<article class="agent-card">
              <div class="agent-card-head"><span class="agent-card-icon">${agent.icon}</span><span><h2>${agent.name}</h2><p>${agent.active ? "Operational" : "Paused"} · ${agent.version}</p></span><button class="toggle ${agent.active ? "on" : ""}" data-agent-toggle="${agent.id}" aria-label="${agent.active ? "Pause" : "Activate"} ${agent.name}"><span></span></button></div>
              <p class="agent-description">${agent.purpose}</p>
              <div class="agent-stats"><div class="agent-stat"><span>Runs</span><b>${agent.runs}</b></div><div class="agent-stat"><span>Quality</span><b>${agent.quality}</b></div><div class="agent-stat"><span>Latency</span><b>${agent.latency}</b></div></div>
              <div class="agent-card-foot"><span class="version">Updated 2 days ago · threshold ${agent.threshold}%</span><button class="btn btn-quiet" data-config-agent="${agent.id}">Manage agent</button></div>
            </article>`).join("")}
          </div>
        </section>`;
      }

      function renderPrograms() {
        return `<section class="view">
          ${header("Admin zone · Programs", "Recruiting programs, under control.", "Turn programs on or off, monitor progress and keep criteria, owners and recruiting windows current.", '<div class="page-actions"><button class="btn btn-primary" id="createProgram">+ Create program</button></div>')}
          <div class="program-admin-grid">
            ${programs.map(program => `<article class="program-card ${program.active ? "" : "off"}">
              <div class="program-card-top"><span class="program-logo">${program.short}</span><span><h2>${program.name}</h2><p>${program.owner} · ${program.active ? "Accepting candidates" : "Program closed"}</p></span><button class="toggle ${program.active ? "on" : ""}" data-program-toggle="${program.id}" aria-label="${program.active ? "Turn off" : "Turn on"} ${program.name}"><span></span></button></div>
              <div class="program-card-body">
                <div class="program-meta"><div><span>Recruiting window</span><b>${program.opened}<br>→ ${program.closes}</b></div><div><span>Candidates</span><b>${program.counts[0]} total</b></div><div><span>Hiring target</span><b>${program.hired}/${program.target} filled</b></div></div>
                <div class="program-progress"><div class="program-progress-head"><span>Target progress</span><span>${Math.round(program.hired / program.target * 100)}%</span></div><div class="track"><i style="width:${Math.min(100, program.hired / program.target * 100)}%;background:${program.active ? "var(--teal)" : "#8da0a3"}"></i></div></div>
              </div>
              <div class="program-card-foot"><span>${program.active ? `${program.health}% pipeline health · ${program.counts[3]} in interviews` : "Historical data remains available"}</span><button class="btn btn-quiet" data-manage-program="${program.id}">Manage program</button></div>
            </article>`).join("")}
          </div>
        </section>`;
      }

      function render() {
        const labels = { overview: "Overview", pipeline: "Talent pipeline", agents: "AI Agent Admin", programs: "Programs", candidate: "Candidate details" };
        document.querySelector("#crumb").textContent = labels[state.view];
        const pipelineCount = document.querySelector('[data-view="pipeline"] .nav-count');
        if (pipelineCount) pipelineCount.textContent = candidates.length;
        const renderers = { overview: renderOverview, pipeline: renderPipeline, agents: renderAgents, programs: renderPrograms, candidate: renderCandidateDetail };
        root.innerHTML = renderers[state.view]();
        bindViewControls();
      }

      function bindViewControls() {
        document.querySelectorAll("[data-go]").forEach(button => button.addEventListener("click", () => setView(button.dataset.go)));
        document.querySelectorAll("[data-program-filter]").forEach(button => button.addEventListener("click", () => { state.program = button.dataset.programFilter; state.stage = "all"; state.page = 1; setView("pipeline"); }));
        document.querySelectorAll("[data-open-stage]").forEach(button => button.addEventListener("click", () => { state.stage = button.dataset.openStage; state.program = "all"; state.page = 1; setView("pipeline"); }));
        document.querySelectorAll("[data-trend]").forEach(button => button.addEventListener("click", () => { state.trend = button.dataset.trend; render(); }));
        document.querySelectorAll("[data-candidate]").forEach(button => button.addEventListener("click", () => setView("candidate", button.dataset.candidate)));
        document.querySelectorAll("[data-agent-toggle]").forEach(button => button.addEventListener("click", () => toggleAgent(button.dataset.agentToggle)));
        document.querySelectorAll("[data-program-toggle]").forEach(button => button.addEventListener("click", () => toggleProgram(button.dataset.programToggle)));
        document.querySelectorAll("[data-config-agent]").forEach(button => button.addEventListener("click", () => openAgentModal(button.dataset.configAgent)));
        document.querySelectorAll("[data-manage-program]").forEach(button => button.addEventListener("click", () => openProgramModal(button.dataset.manageProgram)));
        document.querySelectorAll("[data-action]").forEach(button => button.addEventListener("click", () => handleCandidateAction(button.dataset.action)));

        const search = document.querySelector("#candidateSearch");
        if (search) search.addEventListener("input", event => { state.search = event.target.value; state.page = 1; renderPipelineRows(); });
        ["program", "stage", "score"].forEach(filter => {
          const element = document.querySelector(`#${filter}Filter`);
          if (element) element.addEventListener("change", event => { state[filter] = event.target.value; state.page = 1; render(); });
        });
        const back = document.querySelector("#backToPipeline");
        if (back) back.addEventListener("click", () => setView(state.lastView === "overview" ? "overview" : "pipeline"));
        const exportButton = document.querySelector("#exportPipeline");
        if (exportButton) exportButton.addEventListener("click", () => showToast("Pipeline export prepared with current filters."));
        const addCandidate = document.querySelector("#addCandidate");
        if (addCandidate) addCandidate.addEventListener("click", openScreeningDrawer);
        const addAgent = document.querySelector("#addAgent");
        if (addAgent) addAgent.addEventListener("click", () => openSimpleModal("Add AI agent", "Agent registry", "Connect a new approved agent to a recruiting workflow.", "Continue setup"));
        const viewLogs = document.querySelector("#viewAgentLogs");
        if (viewLogs) viewLogs.addEventListener("click", () => openAuditModal());
        const createProgram = document.querySelector("#createProgram");
        if (createProgram) createProgram.addEventListener("click", () => openSimpleModal("Create recruiting program", "New program", "Define the program owner, hiring target and recruiting window.", "Create draft"));
        bindPaginationControls();
      }

      function renderPipelineRows() {
        const rows = document.querySelector("#pipelineRows");
        const count = document.querySelector(".result-count");
        const paginationRoot = document.querySelector("#paginationRoot");
        if (!rows) return;
        const filtered = filteredCandidates();
        const pageCandidates = paginatedCandidates(filtered);
        rows.innerHTML = pageCandidates.length ? pageCandidates.map(renderCandidateRow).join("") : '<div class="empty">No candidates match this filter. Try broadening your search.</div>';
        if (count) count.textContent = `${filtered.length} candidates`;
        if (paginationRoot) paginationRoot.innerHTML = renderPagination(filtered.length);
        rows.querySelectorAll("[data-candidate]").forEach(button => button.addEventListener("click", () => setView("candidate", button.dataset.candidate)));
        bindPaginationControls();
      }

      function toggleAgent(id) {
        const agent = agents.find(item => item.id === id);
        agent.active = !agent.active;
        render();
        showToast(`${agent.name} ${agent.active ? "activated" : "paused"}.`);
      }
      function toggleProgram(id) {
        const program = programById(id);
        program.active = !program.active;
        render();
        showToast(`${program.name} is now ${program.active ? "active" : "turned off"}.`);
      }

      function handleCandidateAction(action) {
        const candidate = candidateById(state.selectedCandidate);
        if (action === "advance") {
          const nextStage = candidate.stage === "qualified" ? "review" : "interview";
          candidate.stage = nextStage;
          candidate.next = nextStage === "review" ? "TA approval for interview" : "Schedule panel interview";
          candidate.timeline.unshift([nextStage === "review" ? "TA review started" : "Advanced to structured interview", "Just now · Minh Nguyen"]);
          refreshProgramCounts();
          render();
          showToast(`${candidate.name} moved to ${stageLabels[nextStage]} with the AI evidence brief attached.`);
        } else if (action === "approve-offer") {
          candidate.timeline.unshift(["Offer decision approved", "Just now · Minh Nguyen"]);
          render();
          showToast(`${candidate.name}’s offer was approved by the accountable human owner.`);
        } else if (action === "schedule") {
          openScheduleModal(candidate);
        } else if (action === "request-evidence") {
          openEvidenceModal(candidate);
        } else if (action === "copilot") {
          openCopilotModal(candidate);
        } else if (action === "score-details") {
          openScoreModal(candidate);
        }
      }

      function openModal(content) {
        modalRoot.innerHTML = `<div class="modal-backdrop" id="modalBackdrop">${content}</div>`;
        document.body.style.overflow = "hidden";
        document.querySelectorAll("[data-close-modal]").forEach(button => button.addEventListener("click", closeModal));
        document.querySelector("#modalBackdrop").addEventListener("click", event => { if (event.target.id === "modalBackdrop") closeModal(); });
      }
      function closeModal() { modalRoot.innerHTML = ""; document.body.style.overflow = ""; }

      function openScheduleModal(candidate) {
        openModal(`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="scheduleTitle">
          <div class="modal-head"><div><p class="eyebrow">Scheduling Agent</p><h2 id="scheduleTitle">Find the best slot for ${candidate.name}</h2><p>No manual scheduling—AI checks the next seven days and recommends one slot.</p></div><button class="icon-button" data-close-modal aria-label="Close">×</button></div>
          <div class="modal-body">
            <div class="calendar-scan-state" id="calendarScanState"><div><span class="screen-agent-spinner"></span><strong>Scanning interviewer calendars</strong><p>Checking Hanh Le and Tuan Pham’s availability, ${candidate.name}’s preferences and 60-minute panel requirements.</p><span class="scan-window">29 Jul–4 Aug · Next 7 days</span></div></div>
            <div class="hidden" id="calendarRecommendation">
              <div class="slot-found-head"><h3>Best-fit slot found</h3><span class="pill green">Highest availability match</span></div>
              <div class="recommended-slot">
                <div class="slot-main">
                  <div class="slot-date"><span>Thu</span><strong>30</strong><small>July</small></div>
                  <div class="slot-time"><strong>10:30–11:30</strong><span>Structured product interview</span><small>GMT+7 · 60 minutes · Video call</small></div>
                  <span class="pill green slot-fit">Best fit</span>
                </div>
                <div class="slot-attendees">
                  <div class="slot-person"><span class="slot-person-avatar">HL</span><span><b>Hanh Le</b><span>Free · interviewer</span></span></div>
                  <div class="slot-person"><span class="slot-person-avatar">TP</span><span><b>Tuan Pham</b><span>Free · TA panel</span></span></div>
                  <div class="slot-person"><span class="slot-person-avatar">${candidate.initials}</span><span><b>${candidate.name}</b><span>Preferred window</span></span></div>
                </div>
                <div class="slot-reasons"><h4>Why the agent recommends this slot</h4><ul><li>All required attendees are available</li><li>Candidate’s preferred interview window</li><li>30-minute buffer around panel meetings</li><li>Earliest high-confidence slot this week</li></ul></div>
              </div>
              <div class="schedule-confirmation" id="scheduleConfirmation">
                <div class="confirmation-copy"><span class="confirmation-icon" id="confirmationIcon">?</span><span><b id="confirmationTitle">Interviewer confirmation needed</b><span id="confirmationMeta">The agent will ask Hanh Le to confirm this recommended slot.</span></span></div>
                <button class="btn btn-secondary" id="requestSlotConfirmation">Ask interviewer to confirm</button>
              </div>
              <p class="auto-send-note">After TA finalizes, the agent automatically sends invitations to the candidate and panel, attaches the evidence brief and invites Interview Copilot.</p>
            </div>
          </div>
          <div class="modal-foot"><button class="btn btn-quiet" data-close-modal>Cancel</button><button class="btn btn-primary" id="finalizeSchedule" disabled>Finalize confirmed slot</button></div>
        </section>`);
        setTimeout(() => {
          if (!document.querySelector("#calendarRecommendation")) return;
          document.querySelector("#calendarScanState").classList.add("hidden");
          document.querySelector("#calendarRecommendation").classList.remove("hidden");
        }, 900);
        document.querySelector("#requestSlotConfirmation").addEventListener("click", event => {
          const button = event.currentTarget;
          button.disabled = true;
          button.textContent = "Waiting for Hanh…";
          document.querySelector("#confirmationTitle").textContent = "Confirmation request sent";
          document.querySelector("#confirmationMeta").textContent = "Hanh Le is reviewing the recommended slot.";
          setTimeout(() => {
            if (!document.querySelector("#scheduleConfirmation")) return;
            const confirmation = document.querySelector("#scheduleConfirmation");
            confirmation.classList.add("confirmed");
            document.querySelector("#confirmationIcon").textContent = "✓";
            document.querySelector("#confirmationTitle").textContent = "Hanh Le confirmed";
            document.querySelector("#confirmationMeta").textContent = "Confirmed just now · slot is ready to finalize.";
            button.classList.add("hidden");
            document.querySelector("#finalizeSchedule").disabled = false;
          }, 1000);
        });
        document.querySelector("#finalizeSchedule").addEventListener("click", () => {
          candidate.stage = "interview";
          candidate.next = "Interview scheduled · Thu 30 Jul, 10:30";
          candidate.timeline.unshift(["Invitations sent automatically", "Just now · candidate, panel and Copilot"], ["Interviewer confirmed AI-recommended slot", "Thu 30 Jul 2026, 10:30"]);
          refreshProgramCounts();
          closeModal();
          render();
          showToast(`Confirmed: invitations sent automatically for ${candidate.name}’s interview.`);
        });
      }

      function openEvidenceModal(candidate) {
        openModal(`<section class="modal small" role="dialog" aria-modal="true" aria-labelledby="evidenceTitle">
          <div class="modal-head"><div><p class="eyebrow">Evidence request</p><h2 id="evidenceTitle">Ask ${candidate.name} for focused evidence</h2><p>The agent drafted this request from the identified gap.</p></div><button class="icon-button" data-close-modal aria-label="Close">×</button></div>
          <div class="modal-body"><div class="field"><label>Evidence gap</label><input class="input" value="${candidate.gap}"></div><div class="field"><label>Message to candidate</label><textarea class="input">Hi ${candidate.name.split(" ")[0]}, thanks for your application. To complete our review, could you share one concise example that demonstrates ${candidate.gap.toLowerCase()}? You may use a past project, assignment or portfolio artifact.</textarea></div><div class="field"><label>Due date</label><select class="select"><option>Within 3 days · 31 Jul 2026</option><option>Within 5 days · 02 Aug 2026</option></select></div></div>
          <div class="modal-foot"><button class="btn btn-quiet" data-close-modal>Cancel</button><button class="btn btn-primary" id="sendEvidence">Send request</button></div>
        </section>`);
        document.querySelector("#sendEvidence").addEventListener("click", () => { candidate.timeline.unshift(["Focused evidence requested", "Just now · due in 3 days"]); closeModal(); render(); showToast(`Evidence request sent to ${candidate.name}.`); });
      }

      function openCopilotModal(candidate) {
        openModal(`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="copilotTitle">
          <div class="modal-head"><div><p class="eyebrow">Interview Copilot</p><h2 id="copilotTitle">Copilot briefing for ${candidate.name}</h2><p>Ready before, during and after the structured interview.</p></div><button class="icon-button" data-close-modal aria-label="Close">×</button></div>
          <div class="modal-body">
            <div class="agent-box" style="margin-top:0"><div class="agent-line"><span class="agent-mark">AI</span><span><b>Briefing ready · consent required before joining</b><span>The agent cannot make the hiring decision and keeps an auditable evidence trail.</span></span></div></div>
            <p class="label" style="margin:17px 0 8px">During the interview</p>
            <div class="source-row"><div class="source-card"><div class="source-top"><span class="source-icon">▤</span><span class="verified">Live</span></div><b>Structured notes</b><p>Logs evidence against the interview rubric.</p></div><div class="source-card"><div class="source-top"><span class="source-icon">?</span><span class="verified">Assist</span></div><b>Gap coverage</b><p>Flags missing areas for interviewer follow-up.</p></div><div class="source-card"><div class="source-top"><span class="source-icon">◎</span><span class="verified">Draft</span></div><b>Pre-score</b><p>Prepares a score with citations for panel review.</p></div></div>
            <p class="label" style="margin:17px 0 8px">Priority evidence gap</p><div class="evidence-gap"><span class="gap-icon">!</span><div><strong>${candidate.gap}</strong><p>${candidate.gapDetail}</p></div></div>
          </div>
          <div class="modal-foot"><button class="btn btn-quiet" data-close-modal>Close</button><button class="btn btn-primary" id="prepareCopilot">Attach to next interview</button></div>
        </section>`);
        document.querySelector("#prepareCopilot").addEventListener("click", () => { closeModal(); showToast(`Interview Copilot attached to ${candidate.name}’s next session.`); });
      }

      function openScoreModal(candidate) {
        const detailedScores = detailedCandidateScores(candidate);
        const rubricPoints = detailedScores.reduce((total, competency) => total + competency.points, 0);
        openModal(`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="rubricTitle">
          <div class="modal-head"><div><p class="eyebrow">Detailed score</p><h2 id="rubricTitle">${candidate.name} · ${candidate.score}/100 readiness</h2><p>Aligned to the six competencies and 65-point rubric used in the Student Portal.</p></div><button class="icon-button" data-close-modal aria-label="Close">×</button></div>
          <div class="modal-body">
            <p class="detailed-score-intro">The TA view combines verified learning history, assignments and CV evidence into the same competency structure candidates see in their Student Portal.</p>
            <div class="detailed-score-summary">
              <div><span>Overall readiness</span><b>${candidate.score}/100</b></div>
              <div><span>Rubric evidence</span><b>${rubricPoints}/65</b></div>
              <div><span>Verified sources</span><b>${candidate.sources.length}</b></div>
            </div>
            <div class="detailed-score-list">
              ${detailedScores.map(competency => `<div class="detailed-score-row">
                <div><b>${competency.name}</b><span>Course ${competency.course} · ${competency.criteria} rubric ${competency.criteria === 1 ? "criterion" : "criteria"}</span></div>
                <div><b>${competency.source}</b><span>${competency.stars}/5★ · ${competency.points}/${competency.maxPoints} rubric points</span></div>
                <div class="detailed-score-value"><div class="track"><i style="width:${competency.score}%"></i></div><b>${competency.score}</b></div>
              </div>`).join("")}
            </div>
            <p class="score-governance-note">Scores support prioritization and interview preparation. They do not determine employment outcomes; TA and the interview panel remain responsible for every decision.</p>
          </div>
          <div class="modal-foot"><button class="btn btn-primary" data-close-modal>Done</button></div>
        </section>`);
      }

      function openAgentModal(id) {
        const agent = agents.find(item => item.id === id);
        openModal(`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="agentTitle"><div class="modal-head"><div><p class="eyebrow">Agent configuration</p><h2 id="agentTitle">${agent.name}</h2><p>${agent.version} · changes are logged for audit.</p></div><button class="icon-button" data-close-modal aria-label="Close">×</button></div><div class="modal-body"><div class="config-grid"><div class="field"><label>Agent name</label><input class="input" value="${agent.name}"></div><div class="field"><label>Assigned workflow</label><select class="select"><option>All active programs</option><option>Selected programs only</option></select></div><div class="field full"><label>Purpose</label><textarea class="input">${agent.purpose}</textarea></div><div class="field full"><label>Human review threshold</label><div class="range-row"><input id="thresholdRange" type="range" min="50" max="100" value="${agent.threshold}"><output id="thresholdOutput">${agent.threshold}%</output></div></div><div class="field"><label>Escalation policy</label><select class="select"><option>Always escalate material gaps</option><option>Escalate low confidence only</option></select></div><div class="field"><label>Model release</label><select class="select"><option>${agent.version} · Current</option><option>Stable previous release</option></select></div></div></div><div class="modal-foot"><button class="btn btn-quiet" data-close-modal>Cancel</button><button class="btn btn-primary" id="saveAgent">Save agent</button></div></section>`);
        const range = document.querySelector("#thresholdRange");
        range.addEventListener("input", () => document.querySelector("#thresholdOutput").value = `${range.value}%`);
        document.querySelector("#saveAgent").addEventListener("click", () => { agent.threshold = Number(range.value); closeModal(); render(); showToast(`${agent.name} updated; audit event recorded.`); });
      }

      function openProgramModal(id) {
        const program = programById(id);
        openModal(`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="programTitle"><div class="modal-head"><div><p class="eyebrow">Program settings</p><h2 id="programTitle">${program.name}</h2><p>Manage ownership, recruiting window and hiring target.</p></div><button class="icon-button" data-close-modal aria-label="Close">×</button></div><div class="modal-body"><div class="config-grid"><div class="field full"><label>Program name</label><input class="input" value="${program.name}"></div><div class="field"><label>Program owner</label><select class="select"><option>${program.owner}</option><option>Minh Nguyen</option><option>Hanh Le</option></select></div><div class="field"><label>Hiring target</label><input class="input" type="number" value="${program.target}"></div><div class="field"><label>Recruiting opens</label><input class="input" type="date" value="2026-07-04"></div><div class="field"><label>Recruiting closes</label><input class="input" type="date" value="2026-08-14"></div><div class="field full"><label>Candidate criteria</label><textarea class="input">Early-career talent with demonstrated customer empathy, structured product thinking and evidence of learning agility.</textarea></div></div></div><div class="modal-foot"><button class="btn btn-quiet" data-close-modal>Cancel</button><button class="btn btn-primary" id="saveProgram">Save program</button></div></section>`);
        document.querySelector("#saveProgram").addEventListener("click", () => { closeModal(); showToast(`${program.name} settings saved.`); });
      }

      function openAuditModal() {
        openModal(`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="auditTitle"><div class="modal-head"><div><p class="eyebrow">Agent governance</p><h2 id="auditTitle">Recent audit events</h2><p>Configuration and operational events across all agents.</p></div><button class="icon-button" data-close-modal aria-label="Close">×</button></div><div class="modal-body"><div class="activity-list">${[["Evidence Agent threshold updated to 78%", "Today, 09:14 · Minh Nguyen"],["Interview Copilot joined candidate session", "Yesterday, 16:02 · consent recorded"],["Scheduling Agent calendar scope updated", "26 Jul, 11:35 · Hanh Le"],["Program Health Agent v1.6 deployed", "24 Jul, 08:00 · System"]].map(event => `<div class="activity"><b>${event[0]}</b><span>${event[1]}</span></div>`).join("")}</div></div><div class="modal-foot"><button class="btn btn-primary" data-close-modal>Done</button></div></section>`);
      }

      function openScreeningDrawer() {
        modalRoot.innerHTML = `<div class="screening-backdrop" id="screeningBackdrop">
          <section class="screening-drawer" role="dialog" aria-modal="true" aria-labelledby="screeningTitle">
            <div class="screening-head">
              <div><div class="screening-title"><h2 id="screeningTitle">AI Screening</h2><span class="screening-spark">✣</span></div><p>Upload a CV or paste a link to see AI match evidence and recommendations.</p></div>
              <button class="icon-button" data-close-modal aria-label="Close">×</button>
            </div>
            <div class="screening-body">
              <section class="screen-step">
                <div class="screen-step-head"><span class="screen-step-number">1</span><h3>Upload candidate CV</h3></div>
                <div class="screen-upload empty" id="screenDropZone">
                  <span class="screen-file-icon">↥</span>
                  <span class="screen-file-copy"><strong id="screenFileName">Choose a CV to begin</strong><span id="screenFileMeta">PDF, DOC or DOCX · up to 10 MB</span></span>
                  <span class="screen-file-check hidden" id="screenFileCheck">✓</span>
                </div>
                <div class="screen-or">or</div>
                <div class="screen-source-row">
                  <button class="screen-source" id="pasteLinkedIn">▣&nbsp; Paste LinkedIn</button>
                  <button class="screen-source" id="chooseScreenFile">↥&nbsp; Choose file</button>
                  <button class="screen-source" id="useDemoCV">✦&nbsp; Use demo CV</button>
                </div>
                <div class="screen-link-field" id="screenLinkField"><input class="input" id="screenLinkedInUrl" type="url" placeholder="https://linkedin.com/in/candidate"><button class="btn btn-secondary" id="useLinkedIn">Use link</button></div>
                <input class="hidden" id="screenFileInput" type="file" accept=".pdf,.doc,.docx">
              </section>

              <section class="screen-step is-locked" id="screenRoleStep">
                <div class="screen-step-head"><span class="screen-step-number">2</span><h3>Select role for matching</h3></div>
                <div class="screen-role-wrap"><span class="screen-role-icon">▣</span><select class="select" id="screenRole" disabled><option value="pmt">Product Management Trainee 2026</option><option value="apm">Associate Product Manager</option><option value="dmt">Digital Growth Trainee</option></select></div>
              </section>

              <section class="screen-step is-locked" id="screenAgentStep">
                <div class="screen-step-head"><span class="screen-step-number">3</span><h3>Run AI screening</h3></div>
                <div class="screen-agent-action">
                  <button class="btn btn-primary screen-run-button" id="runScreening" disabled>✦ Run AI Screening</button>
                  <div class="screen-agent-progress hidden" id="screeningProgress"><span class="screen-agent-spinner"></span><span><strong>AI Screening Agent is reviewing the evidence</strong><span>Extracting experience, matching competencies and identifying evidence gaps…</span></span></div>
                </div>
                <div class="screen-result hidden" id="screeningResult">
                  <div class="screen-result-top">
                    <div class="screen-score-ring"><span><strong>91%</strong><small>match</small></span></div>
                    <div class="screen-result-copy"><span class="screen-match-label">Strong match</span><h4>Eligible — interview ready</h4><p>Candidate shows high alignment with <span id="screeningRoleName">Product Management Trainee 2026</span>.</p><button class="screen-detail-link" id="screenAnalysisDetail">View detailed analysis →</button></div>
                  </div>
                  <div class="screen-evidence-grid">
                    <div class="screen-evidence positive"><h4>Highlighted strengths</h4><ul><li>Product thinking</li><li>Problem solving</li><li>Data analysis</li><li>Execution</li></ul></div>
                    <div class="screen-evidence gaps"><h4>Evidence gaps to review</h4><ul><li>Communication</li><li>Business impact</li><li>Stakeholder management</li></ul></div>
                  </div>
                </div>
                <p class="screen-match-title hidden">Best-matched roles for this candidate</p>
                <div class="screen-matches hidden"><div class="screen-match best"><span>PM Trainee</span><b>91%</b></div><div class="screen-match"><span>Product Manager</span><b>81%</b></div><div class="screen-match"><span>Data PM</span><b>74%</b></div><div class="screen-match"><span>AI PM</span><b>56%</b></div></div>
              </section>

              <section class="screen-step hidden" id="screenNextStep">
                <div class="screen-step-head"><span class="screen-step-number">4</span><h3>Choose next step</h3></div>
                <div class="screen-actions"><button class="btn btn-primary" id="addScreenedCandidate">+ Add to pipeline</button><button class="btn btn-quiet" id="saveTalentPool">▮ Save to Talent Pool</button><button class="btn btn-danger" id="markNotFit">× Not a fit</button></div>
              </section>
            </div>
          </section>
        </div>`;
        document.body.style.overflow = "hidden";

        const closeButtons = modalRoot.querySelectorAll("[data-close-modal]");
        closeButtons.forEach(button => button.addEventListener("click", closeModal));
        document.querySelector("#screeningBackdrop").addEventListener("click", event => { if (event.target.id === "screeningBackdrop") closeModal(); });

        const fileInput = document.querySelector("#screenFileInput");
        const dropZone = document.querySelector("#screenDropZone");
        const roleStep = document.querySelector("#screenRoleStep");
        const agentStep = document.querySelector("#screenAgentStep");
        const roleSelect = document.querySelector("#screenRole");
        const runButton = document.querySelector("#runScreening");
        let screenedCandidateName = "Ngoc Anh";
        let screeningComplete = false;
        const deriveName = fileName => {
          const cleaned = fileName.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").replace(/\b(cv|resume|profile)\b/gi, "").replace(/\s+/g, " ").trim();
          return cleaned ? cleaned.toLowerCase().replace(/\b\w/g, letter => letter.toUpperCase()) : "New Candidate";
        };
        const updateFile = file => {
          if (!file) return;
          if (file.size > 10485760) return showToast("Choose a CV smaller than 10 MB.");
          const size = file.size >= 1048576 ? `${(file.size / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(file.size / 1024))} KB`;
          document.querySelector("#screenFileName").textContent = file.name;
          document.querySelector("#screenFileMeta").textContent = `${size} · uploaded`;
          document.querySelector("#screenFileCheck").classList.remove("hidden");
          dropZone.classList.remove("empty");
          dropZone.querySelector(".screen-file-icon").textContent = file.name.toLowerCase().endsWith(".pdf") ? "PDF" : "DOC";
          screenedCandidateName = deriveName(file.name);
          roleStep.classList.remove("is-locked");
          agentStep.classList.remove("is-locked");
          roleSelect.disabled = false;
          runButton.disabled = false;
          showToast(`${file.name} is ready for AI screening.`);
        };
        document.querySelector("#chooseScreenFile").addEventListener("click", () => fileInput.click());
        dropZone.addEventListener("click", () => fileInput.click());
        document.querySelector("#useDemoCV").addEventListener("click", () => updateFile({ name: "Ngoc_Anh_CV.pdf", size: 1258291 }));
        fileInput.addEventListener("change", () => updateFile(fileInput.files[0]));
        ["dragenter", "dragover"].forEach(type => dropZone.addEventListener(type, event => { event.preventDefault(); dropZone.classList.add("dragging"); }));
        ["dragleave", "drop"].forEach(type => dropZone.addEventListener(type, event => { event.preventDefault(); dropZone.classList.remove("dragging"); }));
        dropZone.addEventListener("drop", event => updateFile(event.dataTransfer.files[0]));

        document.querySelector("#pasteLinkedIn").addEventListener("click", () => {
          document.querySelector("#screenLinkField").classList.add("show");
          document.querySelector("#screenLinkedInUrl").focus();
        });
        document.querySelector("#useLinkedIn").addEventListener("click", () => {
          const url = document.querySelector("#screenLinkedInUrl").value.trim();
          if (!url) return showToast("Paste a LinkedIn profile URL first.");
          document.querySelector("#screenFileName").textContent = "LinkedIn profile";
          document.querySelector("#screenFileMeta").textContent = "Profile evidence imported";
          document.querySelector("#screenFileCheck").classList.remove("hidden");
          dropZone.classList.remove("empty");
          dropZone.querySelector(".screen-file-icon").textContent = "IN";
          screenedCandidateName = "LinkedIn Candidate";
          roleStep.classList.remove("is-locked");
          agentStep.classList.remove("is-locked");
          roleSelect.disabled = false;
          runButton.disabled = false;
          document.querySelector("#screenLinkField").classList.remove("show");
        });
        roleSelect.addEventListener("change", event => {
          document.querySelector("#screeningRoleName").textContent = event.target.options[event.target.selectedIndex].text;
        });
        runButton.addEventListener("click", () => {
          if (screeningComplete) return;
          runButton.classList.add("hidden");
          document.querySelector("#screeningProgress").classList.remove("hidden");
          roleSelect.disabled = true;
          setTimeout(() => {
            if (!document.querySelector("#screeningResult")) return;
            screeningComplete = true;
            document.querySelector("#screeningProgress").classList.add("hidden");
            document.querySelector("#screeningResult").classList.remove("hidden");
            document.querySelector(".screen-match-title").classList.remove("hidden");
            document.querySelector(".screen-matches").classList.remove("hidden");
            document.querySelector("#screenNextStep").classList.remove("hidden");
            agentStep.querySelector("h3").textContent = "AI screening result";
            agentStep.querySelector(".screen-step-number").textContent = "✓";
            document.querySelector("#screeningResult").scrollIntoView({ behavior: "smooth", block: "start" });
          }, 1100);
        });
        document.querySelector("#screenAnalysisDetail").addEventListener("click", () => showToast("Detailed evidence is included in the candidate record."));
        document.querySelector("#saveTalentPool").addEventListener("click", () => { closeModal(); showToast("Candidate saved to the Talent Pool."); });
        document.querySelector("#markNotFit").addEventListener("click", () => { closeModal(); showToast("Screening marked not a fit; no pipeline record was created."); });
        document.querySelector("#addScreenedCandidate").addEventListener("click", () => {
          const roleId = roleSelect.value;
          const initials = screenedCandidateName.split(" ").map(part => part[0]).join("").slice(0, 2).toUpperCase() || "NC";
          candidates.unshift({
            id: `screened-${Date.now()}`, initials, name: screenedCandidateName, email: "candidate@email.com", school: "CV uploaded directly by TA", location: "Vietnam",
            program: roleId, stage: "review", score: 91, confidence: "High confidence", applied: "Just now", color: ["#e4f5ef", "#16876e"],
            tags: ["AI screened CV", "Strong match"], summary: "Strong product thinking, problem solving and execution evidence from the uploaded CV. Interview validation should focus on communication and stakeholder impact.",
            next: "Advance to structured interview", gap: "Stakeholder communication", gapDetail: "The CV demonstrates strong execution outcomes but provides limited evidence of influencing stakeholders through disagreement.",
            sources: [["Learning history", "No linked history yet", "◎"], ["Assignment", "No assignment yet", "▤"], ["CV", "Uploaded · verified", "▧"]],
            skills: [["Product thinking", 93], ["Problem solving", 90], ["Data reasoning", 86], ["Communication", 72]],
            questions: ["Tell us about a difficult stakeholder disagreement and how you resolved it.", "What evidence changed your product recommendation?", "How did you measure the business impact of your strongest project?"],
            timeline: [["Added through AI Screening", "Just now · Minh Nguyen"], ["CV evidence assessed", "Just now · 91% role match"]]
          });
          refreshProgramCounts();
          resetPipelineFilters();
          closeModal();
          setView("pipeline");
          showToast(`${screenedCandidateName} added to the pipeline with AI screening evidence.`);
        });
      }

      function openSimpleModal(title, eyebrow, description, buttonText) {
        openModal(`<section class="modal small" role="dialog" aria-modal="true" aria-labelledby="simpleTitle"><div class="modal-head"><div><p class="eyebrow">${eyebrow}</p><h2 id="simpleTitle">${title}</h2><p>${description}</p></div><button class="icon-button" data-close-modal aria-label="Close">×</button></div><div class="modal-body"><div class="field"><label>Name</label><input class="input" placeholder="Enter a name"></div><div class="field"><label>Owner or contact</label><input class="input" placeholder="name@company.com"></div></div><div class="modal-foot"><button class="btn btn-quiet" data-close-modal>Cancel</button><button class="btn btn-primary" id="simpleConfirm">${buttonText}</button></div></section>`);
        document.querySelector("#simpleConfirm").addEventListener("click", () => { closeModal(); showToast(`${title} flow is ready for connection to your backend.`); });
      }

      document.querySelectorAll(".nav-item").forEach(button => button.addEventListener("click", () => openNavigationView(button.dataset.view)));
      document.querySelector("#helpButton").addEventListener("click", () => showToast("TA Portal guide opened for this workspace."));
      document.querySelector("#notificationButton").addEventListener("click", () => showToast("You have 6 overdue candidate decisions."));
      document.addEventListener("keydown", event => { if (event.key === "Escape" && modalRoot.innerHTML) closeModal(); });
      render();
    </script>
  </body>
</html>
